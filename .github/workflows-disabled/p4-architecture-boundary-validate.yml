name: P4 Architecture Boundary

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/worker-entry.js'
      - 'src/worker.js'
      - 'src/legacy-compat-router.js'
      - 'src/public-auth-api.js'
      - 'src/category-api.js'
      - 'src/seller-catalog-api.js'
      - 'src/post-core-api.js'
      - 'src/image-upload-api.js'
      - 'scripts/validate-p4-architecture-boundary.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/p4-architecture-boundary-validate.yml'
  push:
    branches:
      - main
    paths:
      - 'src/worker-entry.js'
      - 'src/worker.js'
      - 'src/legacy-compat-router.js'
      - 'src/public-auth-api.js'
      - 'src/category-api.js'
      - 'src/seller-catalog-api.js'
      - 'src/post-core-api.js'
      - 'src/image-upload-api.js'
      - 'scripts/validate-p4-architecture-boundary.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/p4-architecture-boundary-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  architecture-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install exact locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Syntax check retired legacy domains
        run: |
          set -euo pipefail
          node --check src/worker-entry.js
          node --check src/public-auth-api.js
          node --check src/category-api.js
          node --check src/seller-catalog-api.js
          node --check src/post-core-api.js
          node --check src/image-upload-api.js
          node --check scripts/validate-p4-architecture-boundary.mjs
          test ! -e src/worker.js
          test ! -e src/legacy-compat-router.js

      - name: Verify complete legacy runtime retirement contract
        run: npm run test:p4-architecture

      - name: Prove final Worker bundle excludes legacy runtime
        run: |
          set -euo pipefail
          ./node_modules/.bin/esbuild src/worker-entry.js \
            --bundle \
            --format=esm \
            --platform=browser \
            --target=es2022 \
            --outfile=/tmp/p4-worker-entry.js \
            --metafile=/tmp/p4-worker-meta.json
          test -s /tmp/p4-worker-entry.js
          python - <<'PY'
          import json
          from pathlib import Path

          meta = json.loads(Path('/tmp/p4-worker-meta.json').read_text(encoding='utf-8'))
          inputs = {key.replace('\\', '/') for key in meta.get('inputs', {})}
          forbidden = {
              'src/worker.js',
              'src/legacy-compat-router.js',
          }
          leaked = sorted(forbidden & inputs)
          if leaked:
              raise SystemExit('retired legacy modules leaked into Worker bundle: ' + ', '.join(leaked))

          required = {
              'src/worker-entry.js',
              'src/public-auth-api.js',
              'src/category-api.js',
              'src/seller-catalog-api.js',
              'src/post-core-api.js',
              'src/image-upload-api.js',
              'src/orders-api-v2.js',
          }
          missing = sorted(required - inputs)
          if missing:
              raise SystemExit('expected modular runtime inputs missing: ' + ', '.join(missing))

          print(f'P4 BUNDLE PASS: {len(inputs)} bundled inputs, zero retired legacy modules')
          PY

      - name: Canonical validation
        run: npm run validate
