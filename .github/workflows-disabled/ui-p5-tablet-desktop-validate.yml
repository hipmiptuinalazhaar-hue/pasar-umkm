name: UI Responsive V2 Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'css/tablet-desktop-v2.css'
      - 'css/tablet-desktop-v2-base.css'
      - 'css/tablet-desktop-v1.css'
      - 'css/tokens.css'
      - 'index.html'
      - '.github/workflows/ui-p5-tablet-desktop-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-responsive-system:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate responsive architecture and budgets
        shell: python
        run: |
          from pathlib import Path
          import re
          import sys

          css_path = Path('css/tablet-desktop-v2.css')
          base_path = Path('css/tablet-desktop-v2-base.css')
          retired_path = Path('css/tablet-desktop-v1.css')
          index_path = Path('index.html')
          tokens_path = Path('css/tokens.css')
          errors = []

          for path in (css_path, base_path, index_path, tokens_path):
              if not path.exists():
                  errors.append(f'Missing responsive release file: {path}')

          if retired_path.exists():
              errors.append('Legacy responsive owner returned: css/tablet-desktop-v1.css')

          if errors:
              print('\n'.join(errors))
              sys.exit(1)

          css = css_path.read_text(encoding='utf-8')
          base = base_path.read_text(encoding='utf-8')
          index = index_path.read_text(encoding='utf-8')
          tokens = tokens_path.read_text(encoding='utf-8')

          size = css_path.stat().st_size
          print(f'Responsive V2 CSS: {size} / 36000 bytes')
          if size > 36_000:
              errors.append(f'Responsive V2 CSS exceeds source budget: {size} > 36000')

          # v2.3 is intentionally a compatibility override over the retired rail-era base.
          # Keep an explicit transitional ceiling so specificity debt cannot grow unnoticed.
          important_count = css.count('!important')
          important_budget = 120
          print(f'Responsive V2 !important debt: {important_count} / {important_budget}')
          if important_count > important_budget:
              errors.append(f'Responsive V2 !important debt exceeds transitional budget: {important_count} > {important_budget}')

          breakpoints = (
              '@media (min-width: 768px)',
              '@media (min-width: 900px) and (max-width: 1023px)',
              '@media (min-width: 1024px)',
              '@media (min-width: 1280px)',
              '@media (min-width: 1600px)',
          )
          for marker in breakpoints:
              if marker not in css:
                  errors.append(f'Missing responsive device band: {marker}')

          required_contracts = (
              '--p5-feed-max: 720px',
              '--p5-work-max: 920px',
              '--p5-rail: 0px',
              '--p5-social-max: 860px',
              'width: min(720px, calc(100vw - 64px))',
              'height: 64px !important',
              'grid-template-columns: repeat(5, minmax(0, 1fr))',
              'grid-template-columns: repeat(auto-fit, minmax(124px, 1fr))',
              'padding-top: calc(var(--p5-header-height) + 20px)',
              'width: 100vw',
              'body.chat-v7-body .app-navigation',
              '@media (hover: hover) and (pointer: fine)',
              '@media (prefers-reduced-motion: reduce)',
          )
          for marker in required_contracts:
              if marker not in css:
                  errors.append(f'Missing responsive release contract: {marker}')

          for marker in (
              'body.p3-comments-open .bottom-sheet',
              '.commerce-page:has(> .commerce-detail-media)',
              'body.chat-v7-body .app-navigation',
          ):
              if marker not in base:
                  errors.append(f'Responsive compatibility base missing contract: {marker}')

          for retired in ('--p5-rail: 88px', '--p5-rail: 208px'):
              if retired in css:
                  errors.append(f'Current responsive owner reintroduces retired rail: {retired}')

          forbidden = {
              'linear-gradient(': 'decorative gradient',
              'radial-gradient(': 'decorative gradient',
              'backdrop-filter:': 'glass effect',
              '-webkit-backdrop-filter:': 'glass effect',
          }
          for marker, label in forbidden.items():
              if marker in css:
                  errors.append(f'Responsive V2 contains forbidden {label}: {marker}')

          tiny_fonts = [
              float(v)
              for v in re.findall(r'font-size\s*:\s*([0-9.]+)px', css)
              if float(v) < 10
          ]
          if tiny_fonts:
              errors.append(f'Responsive V2 contains fonts below 10px: {tiny_fonts}')

          for label, source in (('Responsive V2', css), ('Responsive V2 base', base)):
              stripped = re.sub(r'/\*.*?\*/', '', source, flags=re.S)
              if stripped.count('{') != stripped.count('}'):
                  errors.append(f'{label} CSS braces are unbalanced')

          retired_href = 'tablet-desktop-v1.css'
          responsive_link_pattern = re.compile(
              r'<link\s+[^>]*href="css/tablet-desktop-v2\.css\?v=([0-9a-f]{12})"[^>]*media="screen and \(min-width: 768px\)"[^>]*>',
              re.S
          )
          responsive_match = responsive_link_pattern.search(index)
          if not responsive_match:
              errors.append('Responsive V2 stylesheet must be wired with a 12-character deterministic fingerprint and media-qualified to >=768px')
          if retired_href in index:
              errors.append('index.html still references retired responsive v1')

          hotfix_marker = '<style id="postP6MobileShellHotfix">'
          mobile_scope = '@media (max-width: 767px)'
          if hotfix_marker not in index or mobile_scope not in index:
              errors.append('Post-P6 shell hotfix is not explicitly mobile-scoped')
          elif responsive_match and responsive_match.start() < index.index(hotfix_marker):
              errors.append('Responsive V2 must load after the mobile-only hotfix block')

          if 'tablet-desktop-v2.css' in tokens or 'tablet-desktop-v1.css' in tokens:
              errors.append('Responsive owner must not be imported from tokens.css')

          if errors:
              print('Responsive V2 validation failed:')
              for error in errors:
                  print(f'- {error}')
              sys.exit(1)

          print(f'Responsive V2 validation passed with fingerprint {responsive_match.group(1)}.')
