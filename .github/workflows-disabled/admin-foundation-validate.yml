name: Admin Foundation Validation

on:
  pull_request:
    paths:
      - 'database/migrations/2026-09-05-admin-foundation.sql'
      - 'scripts/validate-admin-foundation.mjs'
      - 'src/worker.js'
      - '.github/workflows/admin-foundation-validate.yml'
  push:
    branches:
      - main
    paths:
      - 'database/migrations/2026-09-05-admin-foundation.sql'
      - 'scripts/validate-admin-foundation.mjs'
      - 'src/worker.js'
      - '.github/workflows/admin-foundation-validate.yml'

permissions:
  contents: read

jobs:
  validate-admin-foundation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Check validation script syntax
        run: node --check scripts/validate-admin-foundation.mjs

      - name: Enforce admin security contracts
        run: node scripts/validate-admin-foundation.mjs
