name: P4.6 Lockfile Bootstrap

on:
  push:
    branches:
      - p4-5-6-pipeline-supply-chain
    paths:
      - .github/workflows/p4-6-lockfile-bootstrap.yml

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: p4-5-6-pipeline-supply-chain
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Generate lockfile from exact manifest
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Reinstall exactly from lockfile
        run: npm ci --no-audit --no-fund

      - name: Verify lock integrity and exact versions
        run: |
          npm ls --all
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const root = lock.packages?.[''];

          if (lock.lockfileVersion !== 3) throw new Error(`Expected lockfileVersion 3, got ${lock.lockfileVersion}`);
          if (!root) throw new Error('Lockfile root metadata missing.');
          if (pkg.dependencies['@neondatabase/serverless'] !== '1.0.0') throw new Error('Neon manifest version drift.');
          if (pkg.devDependencies.esbuild !== '0.25.10') throw new Error('esbuild manifest version drift.');
          if (root.dependencies['@neondatabase/serverless'] !== '1.0.0') throw new Error('Neon lock root version drift.');
          if (root.devDependencies.esbuild !== '0.25.10') throw new Error('esbuild lock root version drift.');
          if (lock.packages['node_modules/@neondatabase/serverless']?.version !== '1.0.0') throw new Error('Resolved Neon version drift.');
          if (lock.packages['node_modules/esbuild']?.version !== '0.25.10') throw new Error('Resolved esbuild version drift.');

          for (const [path, meta] of Object.entries(lock.packages)) {
            if (!path || !path.startsWith('node_modules/')) continue;
            if (meta.resolved && !meta.integrity) throw new Error(`Missing integrity: ${path}`);
          }
          console.log('Lockfile exact-version and integrity checks passed.');
          NODE

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Commit lockfile only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git diff --cached --quiet && { echo 'Lockfile already current.'; exit 0; }
          git commit -m 'security(p4.6): add reproducible npm lockfile'
          git push origin HEAD:p4-5-6-pipeline-supply-chain
