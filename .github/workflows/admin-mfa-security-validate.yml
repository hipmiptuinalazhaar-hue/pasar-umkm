name: Admin MFA Security Validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-admin-mfa-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Syntax check admin security modules
        run: |
          node --check src/admin-security-core.js
          node --check src/admin-mfa-crypto.js
          node --check src/admin-mfa-api.js
          node --check src/admin-session-security-api.js
          node --check src/admin-auth-api.js
          node --check src/admin-authorization.js
          node --check src/rate-limit.js
          node --check js/admin/api.js
          node --check js/admin/app.js
          node --check js/admin/control.js
          node --check js/admin/security.js

      - name: Validate MFA and privileged-security contracts
        run: node scripts/validate-admin-mfa-security.mjs

      - name: Bundle Worker with locked toolchain
        run: |
          ./node_modules/.bin/esbuild src/worker-entry.js \
            --bundle \
            --format=esm \
            --platform=browser \
            --target=es2022 \
            --outfile=/tmp/worker-entry.js
          test -s /tmp/worker-entry.js
