name: Reels V4 Runtime Finalize

on:
  push:
    branches:
      - feat/reels-commerce-v4-r1-r11
    paths:
      - '.github/workflows/reels-v4-runtime-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout Reels branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/reels-commerce-v4-r1-r11
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund

      - name: Finalize Reels V10 ownership and nested fingerprints
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          account_path = Path('js/account-resilience.js')
          account = account_path.read_text()
          old_gate = "installIntentGate('[data-nav=\"reels\"],[data-action=\"open-story\"],[data-action=\"add-story\"]', () => mediaReady, ensureMediaEnhancements);"
          new_gate = "installIntentGate('[data-action=\"open-story\"],[data-action=\"add-story\"]', () => mediaReady, ensureMediaEnhancements);"
          if old_gate in account:
              account = account.replace(old_gate, new_gate, 1)
          elif new_gate not in account:
              raise SystemExit('Account media gate anchor not found')
          account_path.write_text(account)

          build_path = Path('scripts/build-runtime.mjs')
          build = build_path.read_text()
          const_anchor = 'const V10_BOOT = "js/performance-v10-a.js";\n'
          if 'const REELS_BOOT = "js/reel-profile-separation.js";' not in build:
              if const_anchor not in build:
                  raise SystemExit('V10 boot constant anchor not found')
              build = build.replace(const_anchor, const_anchor + 'const REELS_BOOT = "js/reel-profile-separation.js";\n', 1)

          lazy_anchor = '  "js/performance-v10-c.js",\n'
          if '  REELS_BOOT,\n' not in build:
              if lazy_anchor not in build:
                  raise SystemExit('Lazy boot graph anchor not found')
              build = build.replace(lazy_anchor, lazy_anchor + '  REELS_BOOT,\n', 1)

          function_anchor = 'async function stampLazyBootGraph() {\n'
          nested_helper = "async function stampReelsBootGraph() {\n  let boot = await readFile(REELS_BOOT, \\\"utf8\\\");\n  for (const assetPath of [\n    \\\"css/reels-commerce-v4.css\\\",\n    \\\"css/reels-advanced-creator-v4.css\\\",\n    \\\"js/reels-commerce-v4.js\\\",\n    \\\"js/reels-advanced-creator-v4.js\\\"\n  ]) {\n    const version = await sha12(assetPath);\n    boot = stampVersion(boot, assetPath, version);\n    console.log(`reels-cache-key ${assetPath}=${version}`);\n  }\n  await writeFile(REELS_BOOT, boot, \\\"utf8\\\");\n}\n\n"
          if 'async function stampReelsBootGraph()' not in build:
              if function_anchor not in build:
                  raise SystemExit('Lazy boot function anchor not found')
              build = build.replace(function_anchor, nested_helper + function_anchor, 1)

          call_anchor = 'await stampTokenImports();\nawait stampLazyBootGraph();\n'
          call_replacement = 'await stampTokenImports();\nawait stampReelsBootGraph();\nawait stampLazyBootGraph();\n'
          if 'await stampReelsBootGraph();' not in build:
              if call_anchor not in build:
                  raise SystemExit('Nested fingerprint call anchor not found')
              build = build.replace(call_anchor, call_replacement, 1)
          build_path.write_text(build)
          PY

          node --check js/account-resilience.js
          node --check js/reel-profile-separation.js
          node --check js/performance-v10-a.js
          node --check scripts/build-runtime.mjs

      - name: Rebuild deterministic runtime graph
        run: npm run build:runtime

      - name: Validate canonical and Reels contracts
        run: |
          set -euo pipefail
          npm run validate
          npm run test:reels-v4

      - name: Commit finalized runtime graph
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/account-resilience.js scripts/build-runtime.mjs js/reel-profile-separation.js js/performance-v10-a.js index.html css/tokens.css js/app.runtime.js css/style.runtime.css .assetsignore
          if git diff --cached --quiet; then
            echo 'Reels V10 runtime graph already finalized.'
            exit 0
          fi
          git commit -m 'fix(reels): finalize deterministic V10 runtime ownership'
          git push origin HEAD:feat/reels-commerce-v4-r1-r11
