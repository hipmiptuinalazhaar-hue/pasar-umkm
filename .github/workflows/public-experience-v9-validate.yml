name: Public Experience V9 Validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  responsive-contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Public Experience V9
        run: node scripts/validate-public-experience-v9.mjs
