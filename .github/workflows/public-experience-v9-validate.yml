name: Public Experience V9 Validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  responsive-contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Validate Public Experience V9
        run: node scripts/validate-public-experience-v9.mjs
