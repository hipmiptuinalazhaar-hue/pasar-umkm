name: Auth Production Config Probe

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/auth-production-config-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      AUTH_FROM_EMAIL: ${{ secrets.AUTH_FROM_EMAIL }}
      AUTH_OTP_PEPPER: ${{ secrets.AUTH_OTP_PEPPER }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Probe live auth readiness without exposing secrets
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl --fail-with-body --retry 5 --retry-delay 3 --max-time 20 -sS https://pasar-umkm.hipmiptuinalazhaar.workers.dev/api/health)"
          HEALTH_JSON="$body" node <<'NODE'
          const data = JSON.parse(process.env.HEALTH_JSON || '{}');
          const auth = data.auth || {};
          console.log('LIVE_AUTH_READINESS=' + JSON.stringify({
            verification_ready: auth.verification_ready === true,
            email_provider_configured: auth.email_provider_configured === true,
            sender_configured: auth.sender_configured === true,
            otp_pepper_configured: auth.otp_pepper_configured === true
          }));
          NODE

          check() { if [ -n "${!1:-}" ]; then echo "$1=present"; else echo "$1=missing"; fi; }
          check RESEND_API_KEY
          check AUTH_FROM_EMAIL
          if [ "${#AUTH_OTP_PEPPER}" -ge 32 ]; then echo 'AUTH_OTP_PEPPER=present_valid_length'; elif [ -n "$AUTH_OTP_PEPPER" ]; then echo 'AUTH_OTP_PEPPER=present_too_short'; else echo 'AUTH_OTP_PEPPER=missing'; fi
          check CLOUDFLARE_API_TOKEN
          check CLOUDFLARE_ACCOUNT_ID

      - name: Remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/auth-production-config-probe.yml
          git add .github/workflows/auth-production-config-probe.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(ci): remove auth production config probe'
          git push origin HEAD:main
