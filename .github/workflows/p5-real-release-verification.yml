name: P5 Real Release Verification

on:
  pull_request:
    branches:
      - main
    paths:
      - 'index.html'
      - '_headers'
      - 'admin/**'
      - 'checkout/**'
      - 'purchases/**'
      - 'seller-orders/**'
      - 'support/**'
      - 'legal/**'
      - 'css/**'
      - 'js/**'
      - 'src/**'
      - 'database/migrations/**'
      - 'wrangler.jsonc'
      - 'scripts/browser-release-smoke.mjs'
      - 'scripts/browser-p5-critical-surfaces.mjs'
      - 'scripts/load-smoke-v1.mjs'
      - 'scripts/post-deploy-smoke.mjs'
      - 'scripts/wait-cloudflare-deploy.mjs'
      - 'scripts/validate-p4-final-production.mjs'
      - 'scripts/validate-p5-release-verification.mjs'
      - 'docs/P5_REAL_RELEASE_VERIFICATION.md'
      - '.github/workflows/p5-real-release-verification.yml'
      - '.github/workflows/post-deploy-smoke.yml'
      - 'package.json'
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - '_headers'
      - 'admin/**'
      - 'checkout/**'
      - 'purchases/**'
      - 'seller-orders/**'
      - 'support/**'
      - 'legal/**'
      - 'css/**'
      - 'js/**'
      - 'src/**'
      - 'database/migrations/**'
      - 'wrangler.jsonc'
      - 'scripts/browser-release-smoke.mjs'
      - 'scripts/browser-p5-critical-surfaces.mjs'
      - 'scripts/load-smoke-v1.mjs'
      - 'scripts/post-deploy-smoke.mjs'
      - 'scripts/wait-cloudflare-deploy.mjs'
      - 'scripts/validate-p4-final-production.mjs'
      - 'scripts/validate-p5-release-verification.mjs'
      - 'docs/P5_REAL_RELEASE_VERIFICATION.md'
      - '.github/workflows/p5-real-release-verification.yml'
      - '.github/workflows/post-deploy-smoke.yml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read
  checks: read

concurrency:
  group: p5-real-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install exact locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Syntax check P5 release tooling
        run: |
          node --check scripts/wait-cloudflare-deploy.mjs
          node --check scripts/post-deploy-smoke.mjs
          node --check scripts/browser-release-smoke.mjs
          node --check scripts/browser-p5-critical-surfaces.mjs
          node --check scripts/load-smoke-v1.mjs
          node --check scripts/validate-p5-release-verification.mjs

      - name: Canonical validation including P5
        run: npm run validate

  real-browser:
    needs: release-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      P5_VIEWPORTS: 360x800,390x844,430x932,768x1024,1024x768,1280x800,1366x768,1600x900
      P5_BROWSER_READY_TIMEOUT_MS: '20000'
      P5_CRITICAL_TIMEOUT_MS: '25000'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Wait for exact Cloudflare deployment
        id: deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDFLARE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CLOUDFLARE_WAIT_TIMEOUT_MS: '420000'
          CLOUDFLARE_WAIT_POLL_MS: '5000'
        run: node scripts/wait-cloudflare-deploy.mjs

      - name: Resolve exact browser target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            test -n "$PREVIEW_URL" || { echo "Cloudflare PR preview URL missing."; exit 1; }
            echo "P5_BASE_URL=$PREVIEW_URL" >> "$GITHUB_ENV"
            echo "Browser target: exact PR preview"
          else
            echo "P5_BASE_URL=https://pasar-umkm.hipmiptuinalazhaar.workers.dev" >> "$GITHUB_ENV"
            echo "Browser target: production after exact deploy attestation"
          fi

      - name: Run exact post-deploy HTTP smoke
        if: github.event_name != 'pull_request'
        env:
          EXPECTED_RELEASE: 2026-09-06-platform-hardening-v3
          SMOKE_TIMEOUT_MS: '15000'
        run: PRODUCTION_BASE_URL="$P5_BASE_URL" node scripts/post-deploy-smoke.mjs

      - name: Verify real Chrome runtime
        run: google-chrome --version

      - name: Run real browser viewport matrix
        run: node scripts/browser-release-smoke.mjs

      - name: Run critical-surface browser certification
        run: node scripts/browser-p5-critical-surfaces.mjs

      - name: Run post-deploy public read load smoke
        if: github.event_name != 'pull_request'
        env:
          LOAD_TIERS: 50,100,200
          LOAD_TIMEOUT_MS: '12000'
          LOAD_P95_LIMIT_MS: '8000'
          LOAD_MIN_SUCCESS_RATE: '0.99'
        run: LOAD_BASE_URL="$P5_BASE_URL" node scripts/load-smoke-v1.mjs

      - name: Print browser verification report
        if: always()
        run: |
          if [ -f p5-browser-results/report.json ]; then
            cat p5-browser-results/report.json
          fi
