name: P4.9 Chat Window Bootstrap

on:
  push:
    branches:
      - p4-9-10-chat-profile-hardening

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Apply P4.9 patch
        run: python scripts/p4_9_chat_window_patch.py

      - name: Validate patched JavaScript
        run: |
          set -euo pipefail
          node --check src/chat-management-api.js
          node --check src/chat-media-api-v2.js
          grep -Fq 'ORDER BY dm.created_at DESC, dm.id DESC' src/chat-management-api.js
          grep -Fq 'ORDER BY recent.created_at ASC, recent.id ASC' src/chat-management-api.js
          grep -Fq 'ORDER BY dm.created_at DESC, dm.id DESC' src/chat-media-api-v2.js
          grep -Fq 'ORDER BY recent.created_at ASC, recent.id ASC' src/chat-media-api-v2.js

      - name: Commit patch
        env:
          TARGET_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/chat-management-api.js src/chat-media-api-v2.js
          if git diff --cached --quiet; then
            echo 'Patch already applied.'
            exit 0
          fi
          git commit -m 'fix(p4.9): align latest chat metadata window'
          git push origin HEAD:"$TARGET_REF"
