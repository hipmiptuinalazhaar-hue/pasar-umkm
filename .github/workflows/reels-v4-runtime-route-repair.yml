name: Reels V4 Runtime Route Repair

on:
  push:
    branches:
      - feat/reels-commerce-v4-r1-r11
    paths:
      - '.github/workflows/reels-v4-runtime-route-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/reels-commerce-v4-r1-r11

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund

      - name: Wire Reels into the V10 intent graph
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          boot_path = Path('js/performance-v10-a.js')
          boot = boot_path.read_text()

          asset_anchor = "    saved: 'js/profile-saved.js?v=fbf14ea3f0cd'\n"
          asset_replacement = "    saved: 'js/profile-saved.js?v=fbf14ea3f0cd',\n    reels: 'js/reel-profile-separation.js?v=000000000000'\n"
          if "reels: 'js/reel-profile-separation.js?v=" not in boot:
              if asset_anchor not in boot:
                  raise SystemExit('V10 asset anchor not found')
              boot = boot.replace(asset_anchor, asset_replacement, 1)

          wait_anchor = "  const loaders = Object.freeze({\n"
          wait_helper = """  function waitForReady(ready, label, timeout = 4000) {
    const initial = ready();
    if (initial) return Promise.resolve(initial);
    return new Promise((resolve, reject) => {
      const deadline = Date.now() + timeout;
      const poll = () => {
        const value = ready();
        if (value) { resolve(value); return; }
        if (Date.now() >= deadline) { reject(new Error(`${label} runtime timeout.`)); return; }
        setTimeout(poll, 50);
      };
      poll();
    });
  }

"""
          if 'function waitForReady(ready, label' not in boot:
              if wait_anchor not in boot:
                  raise SystemExit('V10 loader anchor not found')
              boot = boot.replace(wait_anchor, wait_helper + wait_anchor, 1)

          loader_anchor = "    saved: () => loadScript('saved', () => typeof window.hydratePersistentSaved === 'function')\n"
          loader_replacement = "    saved: () => loadScript('saved', () => typeof window.hydratePersistentSaved === 'function'),\n    reels: () => loadScript('reels', () => window.PasarReelsV4?.version === '4.0')\n      .then(() => waitForReady(() => window.PasarReelsV4?.version === '4.0' ? window.PasarReelsV4 : null, 'reels'))\n"
          if "reels: () => loadScript('reels'" not in boot:
              if loader_anchor not in boot:
                  raise SystemExit('V10 saved loader anchor not found')
              boot = boot.replace(loader_anchor, loader_replacement, 1)

          account_reels = "      '[data-nav=\"reels\"]',\n"
          if account_reels in boot:
              boot = boot.replace(account_reels, '', 1)

          account_gate_anchor = "  installIntentGate({\n    selector: [\n      '[data-nav=\"account\"]',\n"
          reels_gate = """  installIntentGate({
    selector: '[data-nav="reels"]',
    ready: () => window.PasarReelsV4?.version === '4.0',
    loader: loaders.reels,
    label: 'reels'
  });

"""
          if "label: 'reels'" not in boot:
              if account_gate_anchor not in boot:
                  raise SystemExit('V10 account gate anchor not found')
              boot = boot.replace(account_gate_anchor, reels_gate + account_gate_anchor, 1)

          boot_path.write_text(boot)

          account_path = Path('js/account-resilience.js')
          account = account_path.read_text()
          old_media_gate = "installIntentGate('[data-nav=\"reels\"],[data-action=\"open-story\"],[data-action=\"add-story\"]', () => mediaReady, ensureMediaEnhancements);"
          new_media_gate = "installIntentGate('[data-action=\"open-story\"],[data-action=\"add-story\"]', () => mediaReady, ensureMediaEnhancements);"
          if old_media_gate in account:
              account = account.replace(old_media_gate, new_media_gate, 1)
          elif new_media_gate not in account:
              raise SystemExit('Account media gate anchor not found')
          account_path.write_text(account)

          build_path = Path('scripts/build-runtime.mjs')
          build = build_path.read_text()
          lazy_anchor = '  "js/performance-v10-c.js",\n'
          lazy_replacement = '  "js/performance-v10-c.js",\n  "js/reel-profile-separation.js",\n'
          if '  "js/reel-profile-separation.js",\n' not in build:
              if lazy_anchor not in build:
                  raise SystemExit('Build lazy graph anchor not found')
              build = build.replace(lazy_anchor, lazy_replacement, 1)
          build_path.write_text(build)
          PY

          node --check js/performance-v10-a.js
          node --check js/account-resilience.js
          node --check js/reel-profile-separation.js
          node --check scripts/build-runtime.mjs

      - name: Stamp fingerprints and validate
        run: |
          set -euo pipefail
          npm run build:runtime
          npm run validate

      - name: Commit route repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/performance-v10-a.js js/account-resilience.js scripts/build-runtime.mjs index.html css/tokens.css js/app.runtime.js css/style.runtime.css .assetsignore
          if git diff --cached --quiet; then
            echo 'Reels runtime route already repaired.'
            exit 0
          fi
          git commit -m 'fix(reels): make Reels a first-class V10 lazy route'
          git push origin HEAD:feat/reels-commerce-v4-r1-r11
