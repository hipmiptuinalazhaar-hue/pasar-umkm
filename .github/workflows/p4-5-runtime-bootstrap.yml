name: P4.5 Runtime Bootstrap

on:
  push:
    branches:
      - p4-5-6-pipeline-supply-chain
    paths:
      - .github/workflows/p4-5-runtime-bootstrap.yml

permissions:
  contents: write

jobs:
  refresh:
    uses: ./.github/workflows/runtime-assets.yml
    with:
      write_changes: true
    permissions:
      contents: write
