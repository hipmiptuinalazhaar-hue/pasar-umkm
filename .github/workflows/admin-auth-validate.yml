name: Admin Auth Validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-admin-auth:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Syntax check admin auth modules
        run: |
          node --check src/admin-auth-api.js
          node --check src/rate-limit.js
          node --check src/worker-entry.js

      - name: Validate admin auth security contracts
        run: node scripts/validate-admin-auth.mjs

      - name: Bundle Worker with locked toolchain
        run: |
          ./node_modules/.bin/esbuild src/worker-entry.js \
            --bundle \
            --format=esm \
            --platform=browser \
            --target=es2022 \
            --outfile=/tmp/worker-entry.js
          test -s /tmp/worker-entry.js
