name: P2 Validation

on:
  pull_request:
    branches:
      - p1-security-performance
      - p0-runtime-schema-hardening
      - main
  push:
    branches:
      - p2-frontend-performance

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find src js -type f -name '*.js' -print0)

      - name: Verify V10 bootstrap acceleration
        shell: bash
        run: |
          set -euo pipefail
          v10='js/performance-v10-a.js'
          account='js/account-resilience.js'
          grep -q 'warmPublicBootstrap' "$v10"
          grep -q 'PUBLIC_CACHE_TTL_MS' "$v10"
          grep -q '/api/categories' "$v10"
          grep -q '/api/stores' "$v10"
          grep -q '/api/products' "$v10"
          grep -q '/api/posts' "$v10"
          grep -q 'requestIdleCallback' "$v10"
          grep -q 'hardwareConcurrency' "$v10"
          grep -q 'deviceMemory' "$v10"
          grep -q 'saveData' "$v10"
          grep -q 'installIntentGate' "$v10"
          grep -q 'target.click()' "$v10"
          grep -q 'ensureCoreEnhancements' "$account"
          grep -q 'ensureProfileEnhancements' "$account"
          grep -q 'ensureMediaEnhancements' "$account"
          grep -q 'ensureBusinessEnhancements' "$account"
          grep -q 'schedulePostRenderWarmup' "$account"
          ! grep -q 'loadDeferredEnhancements' "$account"

      - name: Verify secondary modules are intent loaded
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('js/account-resilience.js', 'utf8');
          const v10 = fs.readFileSync('js/performance-v10-a.js', 'utf8');
          const markers = {
            profile: text.indexOf('function ensureProfileEnhancements()'),
            media: text.indexOf('function ensureMediaEnhancements()'),
            business: text.indexOf('function ensureBusinessEnhancements()')
          };
          for (const [name, pos] of Object.entries(markers)) {
            if (pos < 0) throw new Error(`${name} intent loader missing`);
          }
          const owned = [
            ['js/profile-edit.js', markers.profile],
            ['js/rating-core.js', markers.profile],
            ['js/media-experience.js', markers.media],
            ['js/business-agency.js', markers.business]
          ];
          for (const [asset, owner] of owned) {
            const pos = text.indexOf(asset);
            if (pos < owner) throw new Error(`${asset} escaped its intent owner`);
          }
          for (const asset of ['js/chat-single-render-v6.js','js/p8-commerce-integration.js','js/account-resilience.js','js/profile-saved.js']) {
            if (!v10.includes(asset)) throw new Error(`${asset} missing from V10 lazy graph`);
          }
          for (const retired of ['js/chat-media-experience.js','js/store-management-core.js']) {
            if (text.includes(retired)) throw new Error(`${retired} returned to enhancement loader`);
          }
          NODE

      - name: Verify static cache and security headers
        shell: bash
        run: |
          set -euo pipefail
          test -s _headers
          grep -q 'X-Content-Type-Options: nosniff' _headers
          grep -q 'X-Frame-Options: DENY' _headers
          grep -q "frame-ancestors 'none'" _headers
          grep -q 'Referrer-Policy: strict-origin-when-cross-origin' _headers
          grep -q '/css/\*' _headers
          grep -q '/js/\*' _headers
          grep -q '/assets/\*' _headers
          grep -q 'stale-while-revalidate' _headers
          ! grep -qx '_headers' .assetsignore

      - name: Enforce V10 initial payload budgets
        shell: bash
        run: |
          set -euo pipefail
          app_runtime=$(wc -c < js/app.runtime.js)
          v10_runtime=$(wc -c < js/performance-v10-a.js)
          style_runtime=$(wc -c < css/style.runtime.css)
          tokens_css=$(wc -c < css/tokens.css)
          mobile_css=$(wc -c < css/mobile-foundation-v2.css)
          home_css=$(wc -c < css/home-feed-v3.css)
          responsive_css=$(wc -c < css/tablet-desktop-v2.css)
          v9_css=$(wc -c < css/public-experience-v9.css)
          initial_js=$((app_runtime + v10_runtime))
          initial_css=$((style_runtime + tokens_css + mobile_css + home_css + responsive_css + v9_css))
          echo "V10 initial JS source bytes: $initial_js"
          echo "V10 initial CSS source bytes: $initial_css"
          test "$app_runtime" -le 190000
          test "$v10_runtime" -le 12000
          test "$initial_js" -le 200000
          test "$initial_css" -le 300000

      - name: Report oversized repository assets
        shell: bash
        run: |
          set -euo pipefail
          echo 'Assets larger than 1 MiB (informational):'
          find assets -type f -size +1M -print || true
