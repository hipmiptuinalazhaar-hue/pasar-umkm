name: P2 Validation

on:
  pull_request:
    branches:
      - p1-security-performance
      - p0-runtime-schema-hardening
      - main
  push:
    branches:
      - p2-frontend-performance

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find src js -type f -name '*.js' -print0)

      - name: Verify bootstrap acceleration
        shell: bash
        run: |
          set -euo pipefail
          file='js/account-resilience.js'
          grep -q 'warmPublicBootstrap' "$file"
          grep -q 'PUBLIC_CACHE_TTL_MS' "$file"
          grep -q '/api/categories' "$file"
          grep -q '/api/stores' "$file"
          grep -q '/api/products' "$file"
          grep -q '/api/posts' "$file"
          grep -q 'requestIdleCallback' "$file"
          grep -q 'ensureCoreEnhancements' "$file"
          grep -q 'ensureProfileEnhancements' "$file"
          grep -q 'ensureMediaEnhancements' "$file"
          grep -q 'ensureBusinessEnhancements' "$file"
          grep -q 'schedulePostRenderWarmup' "$file"
          ! grep -q 'loadDeferredEnhancements' "$file"

      - name: Verify secondary modules are intent loaded
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('js/account-resilience.js', 'utf8');
          const markers = {
            profile: text.indexOf('function ensureProfileEnhancements()'),
            media: text.indexOf('function ensureMediaEnhancements()'),
            business: text.indexOf('function ensureBusinessEnhancements()')
          };
          for (const [name, pos] of Object.entries(markers)) {
            if (pos < 0) throw new Error(`${name} intent loader missing`);
          }
          const owned = [
            ['js/profile-edit.js', markers.profile],
            ['js/rating-core.js', markers.profile],
            ['js/media-experience.js', markers.media],
            ['js/business-agency.js', markers.business]
          ];
          for (const [asset, owner] of owned) {
            const pos = text.indexOf(asset);
            if (pos < owner) throw new Error(`${asset} escaped its intent owner`);
          }
          for (const retired of ['js/chat-media-experience.js','js/store-management-core.js']) {
            if (text.includes(retired)) throw new Error(`${retired} returned to enhancement loader`);
          }
          NODE

      - name: Verify static cache and security headers
        shell: bash
        run: |
          set -euo pipefail
          test -s _headers
          grep -q 'X-Content-Type-Options: nosniff' _headers
          grep -q 'X-Frame-Options: SAMEORIGIN' _headers
          grep -q 'Referrer-Policy: strict-origin-when-cross-origin' _headers
          grep -q '/css/\*' _headers
          grep -q '/js/\*' _headers
          grep -q '/assets/\*' _headers
          grep -q 'stale-while-revalidate' _headers
          ! grep -qx '_headers' .assetsignore

      - name: Enforce initial payload budgets
        shell: bash
        run: |
          set -euo pipefail
          app_js=$(wc -c < js/app.js)
          resilience_js=$(wc -c < js/account-resilience.js)
          saved_js=$(wc -c < js/profile-saved.js)
          base_css=$(wc -c < css/style.css)
          tokens_css=$(wc -c < css/tokens.css)
          initial_js=$((app_js + resilience_js + saved_js))
          initial_css=$((base_css + tokens_css))
          echo "Initial JS bytes: $initial_js"
          echo "Initial CSS bytes: $initial_css"
          test "$app_js" -le 300000
          test "$initial_js" -le 290000
          test "$initial_css" -le 330000

      - name: Report oversized repository assets
        shell: bash
        run: |
          set -euo pipefail
          echo 'Assets larger than 1 MiB (informational):'
          find assets -type f -size +1M -print || true
