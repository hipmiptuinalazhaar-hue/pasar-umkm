name: P4 Apply Transaction Hardening

on:
  push:
    branches:
      - p4-transaction-runtime-ddl-hardening
    paths:
      - .github/workflows/p4-apply-transaction-hardening.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: p4-transaction-runtime-ddl-hardening
          fetch-depth: 0

      - name: Patch transactional checkout and order state
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/functionality-api.js')
          text = path.read_text(encoding='utf-8')

          old_import = 'import { neon } from "@neondatabase/serverless";'
          new_import = 'import { Client, neon } from "@neondatabase/serverless";'
          if old_import not in text:
              raise SystemExit('Import neon tunggal tidak ditemukan')
          text = text.replace(old_import, new_import, 1)

          helper_marker = 'function orderNumber() {'
          helper = r'''function transactionError(message, status = 409) {
  const error = new Error(message);
  error.status = status;
  return error;
}

async function withDbTransaction(env, work) {
  const client = new Client({ connectionString: env.DATABASE_URL });
  let inTransaction = false;

  try {
    await client.connect();
    await client.query("BEGIN");
    inTransaction = true;

    const result = await work(client);

    await client.query("COMMIT");
    inTransaction = false;
    return result;
  } catch (error) {
    if (inTransaction) {
      try {
        await client.query("ROLLBACK");
      } catch (rollbackError) {
        console.error("Database rollback failed:", rollbackError);
      }
    }

    throw error;
  } finally {
    try {
      await client.end();
    } catch (closeError) {
      console.error("Database client close failed:", closeError);
    }
  }
}

'''
          if helper_marker not in text:
              raise SystemExit('orderNumber marker tidak ditemukan')
          text = text.replace(helper_marker, helper + helper_marker, 1)

          checkout_start = text.index('async function checkoutCart(')
          checkout_end = text.index('\nasync function listOrders(', checkout_start)
          checkout = r'''async function checkoutCart(sql, request, env) {
  const auth = await requireUser(sql, request);

  if (auth.response) {
    return auth.response;
  }

  const body = await request.json().catch(() => null);

  if (!body) {
    return jsonError("Data checkout tidak valid.", 400);
  }

  const customerName = String(body.customer_name || auth.user.name || "").trim().slice(0, 120);
  const customerPhone = String(body.customer_phone || auth.user.phone || "").trim().slice(0, 30);
  const deliveryAddress = String(body.delivery_address || "").trim().slice(0, 1200);
  const notes = String(body.notes || "").trim().slice(0, 1000);

  if (customerName.length < 2) {
    return jsonError("Nama penerima belum valid.", 400);
  }

  if (customerPhone.length < 5) {
    return jsonError("Nomor penerima belum valid.", 400);
  }

  if (deliveryAddress.length < 5) {
    return jsonError("Alamat pengantaran belum valid.", 400);
  }

  try {
    const createdOrders = await withDbTransaction(env, async client => {
      const cartResult = await client.query(
        `
          INSERT INTO carts (user_id)
          VALUES ($1)
          ON CONFLICT (user_id)
          DO UPDATE SET updated_at = carts.updated_at
          RETURNING id
        `,
        [auth.user.id]
      );

      const cartId = cartResult.rows[0]?.id;
      if (!cartId) {
        throw transactionError("Keranjang belum dapat diproses.", 500);
      }

      const cartItemsResult = await client.query(
        `
          SELECT id, product_id, quantity, created_at
          FROM cart_items
          WHERE cart_id = $1
          ORDER BY created_at ASC, id ASC
          FOR UPDATE
        `,
        [cartId]
      );

      const cartItems = cartItemsResult.rows;
      if (!cartItems.length) {
        throw transactionError("Keranjang masih kosong.", 409);
      }

      const productIds = cartItems.map(item => item.product_id);
      const productsResult = await client.query(
        `
          SELECT
            p.id,
            p.name,
            p.price,
            p.stock,
            p.store_id,
            p.is_active,
            s.name AS store_name,
            s.owner_id,
            s.is_active AS store_active
          FROM products p
          JOIN stores s ON s.id = p.store_id
          WHERE p.id = ANY($1::uuid[])
          ORDER BY p.id ASC
          FOR UPDATE OF p, s
        `,
        [productIds]
      );

      const products = new Map(
        productsResult.rows.map(product => [String(product.id), product])
      );
      const groups = new Map();

      for (const cartItem of cartItems) {
        const product = products.get(String(cartItem.product_id));
        if (!product || !product.is_active || !product.store_active) {
          throw transactionError("Ada produk di keranjang yang tidak lagi tersedia.", 409);
        }

        const quantity = Number(cartItem.quantity || 0);
        const stock = Number(product.stock || 0);
        const price = Number(product.price || 0);

        if (!Number.isInteger(quantity) || quantity < 1) {
          throw transactionError("Jumlah produk di keranjang tidak valid.", 409);
        }

        if (quantity > stock) {
          throw transactionError(`Stok ${product.name || "produk"} tidak mencukupi.`, 409);
        }

        const normalized = {
          product_id: product.id,
          name: product.name,
          price,
          quantity,
          store_id: product.store_id,
          store_name: product.store_name,
          owner_id: product.owner_id
        };
        const storeId = String(product.store_id);

        if (!groups.has(storeId)) {
          groups.set(storeId, []);
        }
        groups.get(storeId).push(normalized);
      }

      const orders = [];

      for (const [storeId, items] of groups.entries()) {
        const subtotal = items.reduce(
          (sum, item) => sum + item.price * item.quantity,
          0
        );
        const orderId = crypto.randomUUID();
        const number = orderNumber();

        const insertedOrder = await client.query(
          `
            INSERT INTO orders (
              id,
              order_number,
              buyer_id,
              store_id,
              status,
              subtotal,
              delivery_fee,
              total,
              customer_name,
              customer_phone,
              delivery_address,
              notes
            )
            VALUES (
              $1::uuid,
              $2,
              $3::uuid,
              $4::uuid,
              'pending',
              $5,
              0,
              $5,
              $6,
              $7,
              $8,
              $9
            )
            RETURNING *
          `,
          [
            orderId,
            number,
            auth.user.id,
            storeId,
            subtotal,
            customerName,
            customerPhone,
            deliveryAddress,
            notes || null
          ]
        );

        const order = insertedOrder.rows[0];
        if (!order) {
          throw transactionError("Pesanan gagal dibuat.", 500);
        }

        for (const item of items) {
          const stockResult = await client.query(
            `
              UPDATE products
              SET
                stock = stock - $1,
                updated_at = NOW()
              WHERE
                id = $2::uuid
                AND is_active = TRUE
                AND stock >= $1
              RETURNING id, stock
            `,
            [item.quantity, item.product_id]
          );

          if (!stockResult.rows[0]) {
            throw transactionError(
              `Stok ${item.name || "produk"} berubah. Coba checkout kembali.`,
              409
            );
          }

          await client.query(
            `
              INSERT INTO order_items (
                order_id,
                product_id,
                product_name,
                product_price,
                quantity,
                subtotal
              )
              VALUES ($1::uuid, $2::uuid, $3, $4, $5, $6)
            `,
            [
              order.id,
              item.product_id,
              String(item.name || "Produk"),
              item.price,
              item.quantity,
              item.price * item.quantity
            ]
          );
        }

        await client.query(
          `
            INSERT INTO notifications (
              user_id,
              type,
              title,
              message,
              target_type,
              target_id,
              actor_user_id,
              entity_type,
              entity_id,
              is_read,
              created_at
            )
            VALUES ($1::uuid, 'order', 'Pesanan baru', $2, 'order', $3::uuid, $4::uuid, 'order', $3::uuid, FALSE, NOW())
          `,
          [
            items[0].owner_id,
            `${auth.user.name || "Pembeli"} membuat pesanan ${order.order_number}.`,
            order.id,
            auth.user.id
          ]
        );

        orders.push(order);
      }

      await client.query(
        `DELETE FROM cart_items WHERE cart_id = $1::uuid`,
        [cartId]
      );

      return orders;
    });

    return json({
      ok: true,
      message: "Pesanan berhasil dibuat.",
      orders: createdOrders
    }, 201);
  } catch (error) {
    if (error?.code === "40001" || error?.code === "40P01") {
      return jsonError("Checkout sedang bersaing dengan transaksi lain. Silakan coba lagi.", 409);
    }

    console.error("Checkout transaction error:", error);
    return jsonError(
      error?.message || "Checkout belum dapat diproses.",
      Number.isInteger(error?.status) ? error.status : 500
    );
  }
}
'''
          text = text[:checkout_start] + checkout + text[checkout_end:]

          status_start = text.index('async function updateOrderStatus(')
          status_end = text.index('\nasync function handleOrders(', status_start)
          status_fn = r'''async function updateOrderStatus(sql, request, orderId, env) {
  const auth = await requireUser(sql, request);

  if (auth.response) {
    return auth.response;
  }

  const body = await request.json().catch(() => null);
  const nextStatus = String(body?.status || "").trim().toLowerCase();
  const validStatuses = new Set([
    "pending",
    "confirmed",
    "processing",
    "ready",
    "completed",
    "cancelled"
  ]);

  if (!validStatuses.has(nextStatus)) {
    return jsonError("Status pesanan tidak valid.", 400);
  }

  try {
    const result = await withDbTransaction(env, async client => {
      const orderResult = await client.query(
        `
          SELECT
            o.*,
            s.owner_id AS seller_user_id,
            s.name AS store_name
          FROM orders o
          JOIN stores s ON s.id = o.store_id
          WHERE o.id = $1::uuid
          FOR UPDATE OF o, s
        `,
        [orderId]
      );

      const order = orderResult.rows[0];
      if (!order) {
        throw transactionError("Pesanan tidak ditemukan.", 404);
      }

      const isAdmin = auth.user.role === "admin";
      const isSeller = isAdmin || String(order.seller_user_id) === String(auth.user.id);
      const isBuyer = String(order.buyer_id) === String(auth.user.id) && !isSeller;

      if (!isSeller && !isBuyer) {
        throw transactionError("Anda tidak memiliki akses ke pesanan ini.", 403);
      }

      if (!canTransition(order.status, nextStatus, isSeller, isBuyer)) {
        throw transactionError("Perubahan status pesanan tidak diizinkan.", 403);
      }

      const itemsResult = await client.query(
        `
          SELECT
            id,
            product_id,
            product_name,
            product_price,
            quantity,
            subtotal,
            created_at
          FROM order_items
          WHERE order_id = $1::uuid
          ORDER BY created_at ASC, id ASC
        `,
        [order.id]
      );
      const items = itemsResult.rows;

      if (nextStatus === "cancelled" && order.status !== "cancelled") {
        for (const item of items) {
          if (!item.product_id) continue;

          await client.query(
            `
              UPDATE products
              SET
                stock = stock + $1,
                updated_at = NOW()
              WHERE id = $2::uuid
            `,
            [Number(item.quantity || 0), item.product_id]
          );
        }
      }

      const updatedResult = await client.query(
        `
          UPDATE orders
          SET
            status = $1,
            updated_at = NOW()
          WHERE id = $2::uuid
          RETURNING *
        `,
        [nextStatus, order.id]
      );
      const updated = updatedResult.rows[0];

      const recipientId = isBuyer ? order.seller_user_id : order.buyer_id;
      if (recipientId && String(recipientId) !== String(auth.user.id)) {
        await client.query(
          `
            INSERT INTO notifications (
              user_id,
              type,
              title,
              message,
              target_type,
              target_id,
              actor_user_id,
              entity_type,
              entity_id,
              is_read,
              created_at
            )
            VALUES ($1::uuid, 'order', 'Status pesanan diperbarui', $2, 'order', $3::uuid, $4::uuid, 'order', $3::uuid, FALSE, NOW())
          `,
          [
            recipientId,
            `Pesanan ${order.order_number} sekarang berstatus ${nextStatus}.`,
            order.id,
            auth.user.id
          ]
        );
      }

      return {
        order: updated,
        items
      };
    });

    return json({
      ok: true,
      order: {
        ...result.order,
        items: result.items
      }
    });
  } catch (error) {
    if (error?.code === "40001" || error?.code === "40P01") {
      return jsonError("Status pesanan berubah bersamaan. Silakan coba lagi.", 409);
    }

    console.error("Order status transaction error:", error);
    return jsonError(
      error?.message || "Status pesanan belum dapat diperbarui.",
      Number.isInteger(error?.status) ? error.status : 500
    );
  }
}
'''
          text = text[:status_start] + status_fn + text[status_end:]

          old_handle = 'async function handleOrders(sql, request, url) {'
          new_handle = 'async function handleOrders(sql, request, url, env) {'
          if old_handle not in text:
              raise SystemExit('handleOrders signature tidak ditemukan')
          text = text.replace(old_handle, new_handle, 1)

          old_checkout_call = 'return await checkoutCart(sql, request);'
          if old_checkout_call not in text:
              raise SystemExit('checkout call tidak ditemukan')
          text = text.replace(old_checkout_call, 'return await checkoutCart(sql, request, env);', 1)

          old_status_call = 'return await updateOrderStatus(sql, request, orderId);'
          if old_status_call not in text:
              raise SystemExit('status call tidak ditemukan')
          text = text.replace(old_status_call, 'return await updateOrderStatus(sql, request, orderId, env);', 1)

          old_router_call = 'const orderResponse = await handleOrders(sql, request, url);'
          if old_router_call not in text:
              raise SystemExit('order router call tidak ditemukan')
          text = text.replace(old_router_call, 'const orderResponse = await handleOrders(sql, request, url, env);', 1)

          path.write_text(text, encoding='utf-8')

      - name: Validate transaction patch
        run: |
          node --check src/functionality-api.js
          grep -qF 'import { Client, neon }' src/functionality-api.js
          grep -qF 'await client.query("BEGIN")' src/functionality-api.js
          grep -qF 'await client.query("ROLLBACK")' src/functionality-api.js
          grep -qF 'FOR UPDATE OF p, s' src/functionality-api.js
          grep -qF 'FOR UPDATE OF o, s' src/functionality-api.js
          ! grep -qF 'const decremented = []' src/functionality-api.js
          ! grep -qF 'for (const item of decremented.reverse())' src/functionality-api.js
          grep -qF 'checkoutCart(sql, request, env)' src/functionality-api.js
          grep -qF 'updateOrderStatus(sql, request, orderId, env)' src/functionality-api.js

      - name: Commit P4.1
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/functionality-api.js
          git commit -m 'fix(p4.1): make checkout and order stock changes atomic'
          git push origin HEAD:p4-transaction-runtime-ddl-hardening
