name: P1 Validation

on:
  pull_request:
    branches:
      - main
      - p0-runtime-schema-hardening
  push:
    branches:
      - p1-security-performance

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find src js -type f -name '*.js' -print0)

      - name: Verify rate-limit coverage
        shell: bash
        run: |
          set -euo pipefail
          file='src/rate-limit.js'
          test -s "$file"
          grep -Fq '/api/auth/login' "$file"
          grep -Fq '/api/auth/register' "$file"
          grep -Fq '/api/story-v2/upload-image' "$file"
          grep -Fq '/api/chat/media/upload' "$file"
          grep -Fq 'name: "public-catalog"' "$file"
          grep -Fq 'status: 429' "$file"
          grep -Fq 'Retry-After' "$file"

      - name: Verify catalog cursor pagination
        shell: bash
        run: |
          set -euo pipefail
          file='src/public-catalog-api.js'
          test -s "$file"
          grep -Fq 'mode: "cursor"' "$file"
          grep -Fq 'next_cursor' "$file"
          grep -Fq 'LIMIT ${queryLimit}' "$file"
          grep -Fq 'const queryLimit = limit + 1' "$file"
          grep -Fq '(p.created_at, p.id) <' "$file"
          ! grep -Fq 'OFFSET ${offset}' "$file"
          ! grep -Fq 'COUNT(*)::int AS total' "$file"

      - name: Verify P1 migration safety
        shell: bash
        run: |
          set -euo pipefail
          file='database/migrations/2026-09-02-p1-security-performance.sql'
          test -s "$file"
          grep -Fq 'P1 migration ditolak' "$file"
          grep -Fq '2026-09-02-p0-runtime-schema-hardening' "$file"
          grep -Fq 'uq_stores_owner_id' "$file"
          grep -Fq '2026-09-02-p1-security-performance' "$file"

      - name: Verify entry-point wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'enforceRateLimit' src/worker-entry.js
          grep -Fq 'handlePublicCatalogApi' src/worker-entry.js
          grep -Fq 'p1_applied' src/worker-entry.js
