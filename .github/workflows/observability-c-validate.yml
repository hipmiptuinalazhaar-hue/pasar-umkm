name: Observability C Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/observability.js'
      - 'src/worker-entry.js'
      - 'wrangler.jsonc'
      - 'scripts/validate-observability-c.mjs'
      - '.github/workflows/observability-c-validate.yml'
      - 'docs/OBSERVABILITY_MONITORING_C.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-observability:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate syntax
        run: |
          node --check src/observability.js
          node --check src/worker-entry.js
          node --check scripts/validate-observability-c.mjs

      - name: Validate observability contracts
        run: node scripts/validate-observability-c.mjs

      - name: Validate runtime build remains reproducible
        run: |
          npm ci --ignore-scripts
          npm run build:runtime
          git diff --exit-code -- js/app.runtime.js index.html
