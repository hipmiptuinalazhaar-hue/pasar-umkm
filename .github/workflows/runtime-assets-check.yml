name: Runtime Assets Check

on:
  pull_request:
  push:
    branches:
      - main
      - feat/reels-commerce-v4-r1-r11

permissions:
  contents: write

jobs:
  verify-runtime-assets:
    uses: ./.github/workflows/runtime-assets.yml
    with:
      write_changes: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feat/reels-commerce-v4-r1-r11' }}
    permissions:
      contents: write
