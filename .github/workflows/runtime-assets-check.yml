name: Runtime Assets Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair-reels-router-ownership:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/reels-commerce-v4-r1-r11'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/reels-commerce-v4-r1-r11
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Move Reels ownership into canonical app router
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          app_path = Path('js/app.js')
          app = app_path.read_text()
          anchor = "    case 'categories':\n      openAllCategories();\n      break;\n\n    case 'sell':\n"
          replacement = "    case 'categories':\n      openAllCategories();\n      break;\n\n    case 'reels':\n      window.PasarPerformanceV10?.openReels?.();\n      break;\n\n    case 'sell':\n"
          if "case 'reels':" not in app:
              if anchor not in app:
                  raise SystemExit('navigate() insertion anchor not found')
              app = app.replace(anchor, replacement, 1)

          legacy_heading = "\n/* =========================================================\n   29. MAIN NAVIGATION\n   ========================================================= */\n\n"
          if legacy_heading in app:
              app = app.replace(legacy_heading, '\n', 1)
          app_path.write_text(app)

          boot_path = Path('js/performance-v10-a.js')
          boot = boot_path.read_text()
          gate = (
              "  installIntentGate({\n"
              "    selector: '[data-nav=\"reels\"]',\n"
              "    ready: () => window.PasarReelsV4?.version === '4.0',\n"
              "    loader: loaders.reels,\n"
              "    label: 'reels',\n"
              "    root: doc.querySelector('[data-nav=\"reels\"]') || doc\n"
              "  });\n\n"
          )
          if gate in boot:
              boot = boot.replace(gate, '', 1)

          load_marker = "    load: name => loaders[name]?.() || Promise.reject(new Error(`Unknown V10 feature: ${name}`)),\n"
          open_reels = (
              "    openReels: () => loaders.reels().then(reels => reels.open()).catch(error => {\n"
              "      console.error('[Pasar UMKM] Reels navigation error:', error);\n"
              "      window.showToast?.('Reels belum dapat dibuka. Coba lagi.');\n"
              "    }),\n"
          )
          if "openReels: () => loaders.reels()" not in boot:
              if load_marker not in boot:
                  raise SystemExit('PasarPerformanceV10 load marker not found')
              boot = boot.replace(load_marker, open_reels + load_marker, 1)
          boot_path.write_text(boot)
          PY

          grep -Fq "case 'reels':" js/app.js
          grep -Fq "PasarPerformanceV10?.openReels?.()" js/app.js
          grep -Fq "openReels: () => loaders.reels()" js/performance-v10-a.js
          if grep -Fq "selector: '[data-nav=\"reels\"]'" js/performance-v10-a.js; then
            echo 'Legacy Reels click gate still present.'
            exit 1
          fi
          node --check js/app.js
          node --check js/performance-v10-a.js

      - name: Regenerate deterministic runtime assets
        run: |
          npm run build:runtime
          npm run validate

      - name: Commit router ownership and runtime assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/app.js js/performance-v10-a.js index.html js/reels-v4-entry.js js/reel-profile-separation.js css/tokens.css js/app.runtime.js css/style.runtime.css .assetsignore
          if git diff --cached --quiet; then
            echo 'Reels router ownership and runtime assets already synchronized.'
            exit 0
          fi
          git commit -m 'fix(reels): make app router own lazy Reels navigation'
          git push origin HEAD:feat/reels-commerce-v4-r1-r11

  verify-runtime-assets:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/runtime-assets.yml
    with:
      write_changes: false
    permissions:
      contents: read
