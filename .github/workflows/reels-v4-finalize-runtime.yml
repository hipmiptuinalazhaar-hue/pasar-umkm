name: Reels V4 Finalize Runtime

on:
  push:
    branches:
      - feat/reels-commerce-v4-r1-r11
    paths:
      - '.github/workflows/reels-v4-finalize-runtime.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/reels-commerce-v4-r1-r11
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund
      - name: Build deterministic runtime
        run: npm run build:runtime
      - name: Validate complete application
        run: npm run validate
      - name: Commit generated runtime assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html js/performance-v10-a.js js/reel-profile-separation.js js/reels-v4-entry.js css/tokens.css js/app.runtime.js css/style.runtime.css .assetsignore
          if git diff --cached --quiet; then
            echo 'Runtime assets already deterministic.'
            exit 0
          fi
          git commit -m 'build(reels): finalize deterministic Reels V4 runtime assets'
          git push origin HEAD:feat/reels-commerce-v4-r1-r11
