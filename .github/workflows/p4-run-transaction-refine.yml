name: P4 Run Transaction Refinement

on:
  push:
    branches:
      - p4-transaction-runtime-ddl-hardening
    paths:
      - scripts/p4_transaction_refine.py
      - .github/workflows/p4-run-transaction-refine.yml

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: p4-transaction-runtime-ddl-hardening
          fetch-depth: 0

      - name: Apply lock refinement
        run: python scripts/p4_transaction_refine.py

      - name: Validate transaction structure
        run: |
          node --check src/functionality-api.js
          grep -qF 'FOR UPDATE OF p' src/functionality-api.js
          grep -qF 'FOR UPDATE OF o' src/functionality-api.js
          ! grep -qF 'FOR UPDATE OF p, s' src/functionality-api.js
          ! grep -qF 'FOR UPDATE OF o, s' src/functionality-api.js
          ! grep -qF 'const orderId = crypto.randomUUID();' src/functionality-api.js
          grep -qF 'ORDER BY product_id ASC NULLS LAST, id ASC' src/functionality-api.js

      - name: Commit refinement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/functionality-api.js
          git commit -m 'fix(p4.1): refine checkout lock order and order id handling'
          git push origin HEAD:p4-transaction-runtime-ddl-hardening
