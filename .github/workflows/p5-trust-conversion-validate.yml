name: P5 Trust Conversion Validation

on:
  pull_request:
    paths:
      - 'src/rating-summary-v2.js'
      - 'js/p5-trust-conversion.js'
      - 'css/p5-trust-conversion.css'
      - 'index.html'
      - 'scripts/validate-p5-trust-conversion.mjs'
      - '.github/workflows/p5-trust-conversion-validate.yml'
  push:
    branches:
      - main
      - feature/p5-trust-conversion
    paths:
      - 'src/rating-summary-v2.js'
      - 'js/p5-trust-conversion.js'
      - 'css/p5-trust-conversion.css'
      - 'index.html'
      - 'scripts/validate-p5-trust-conversion.mjs'
      - '.github/workflows/p5-trust-conversion-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trust-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: JavaScript syntax
        run: |
          node --check src/rating-summary-v2.js
          node --check js/p5-trust-conversion.js
          node --check scripts/validate-p5-trust-conversion.mjs

      - name: Validate evidence and UX contracts
        run: node scripts/validate-p5-trust-conversion.mjs
