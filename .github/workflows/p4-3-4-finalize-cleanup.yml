name: P4.3 P4.4 Finalize Cleanup

on:
  push:
    branches:
      - p4-3-chat-integrity-security
    paths:
      - .github/workflows/p4-3-4-finalize-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: p4-3-chat-integrity-security
          fetch-depth: 0

      - name: Verify hardened runtime before cleanup
        run: |
          node --check src/worker-entry.js
          node --check src/chat-media-api-v2.js
          node --check src/chat-message-action-api.js
          node --check src/comment-api.js
          ! grep -qF 'from "./chat-media-api.js"' src/worker-entry.js
          ! grep -qF 'async function messageAction(' src/chat-management-api.js

      - name: Remove deprecated and one-time files
        run: |
          git rm src/chat-media-api.js
          git rm scripts/p4_3_4_frontend_patch.py
          git rm scripts/p4_4_backend_cleanup.py
          git rm .github/workflows/p4-3-4-apply-frontend.yml
          git rm .github/workflows/p4-4-cleanup.yml
          git rm .github/workflows/p4-3-4-finalize-cleanup.yml

      - name: Commit final cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(p4.3-p4.4): remove deprecated security paths and tooling'
          git push origin HEAD:p4-3-chat-integrity-security
