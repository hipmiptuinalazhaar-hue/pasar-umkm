name: UI P4 Chat V7 Validation

on:
  pull_request:
    paths:
      - 'js/chat-experience-v7.js'
      - 'css/chat-experience-v7.css'
      - 'js/chat-single-render-v6.js'
      - 'js/chat-stability-v4.js'
      - 'js/chat-experience.js'
      - 'js/chat-media-experience.js'
      - 'js/chat-mark-read.js'
      - 'js/chat-whatsapp-v5.js'
      - 'css/chat-single-render-v6.css'
      - 'css/chat-stability-v4.css'
      - 'css/chat-experience.css'
      - 'css/chat-layout-v2.css'
      - 'css/chat-whatsapp-v3.css'
      - 'css/chat-whatsapp-v5.css'
      - 'css/chat-bubble-final.css'
      - '.github/workflows/ui-p4-chat-v7-validate.yml'
  push:
    branches:
      - ui-p4-chat

permissions:
  contents: read

jobs:
  validate-chat-v7:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate JavaScript syntax
        run: |
          node --check js/chat-experience-v7.js
          node --check js/chat-single-render-v6.js
          node --check js/chat-stability-v4.js
          node --check js/chat-experience.js
          node --check js/chat-media-experience.js
          node --check js/chat-mark-read.js
          node --check js/chat-whatsapp-v5.js

      - name: Validate single ownership and design budgets
        shell: python
        run: |
          from pathlib import Path
          import re
          import sys

          errors = []

          controller = Path('js/chat-experience-v7.js')
          css = Path('css/chat-experience-v7.css')
          bootstrap = Path('js/chat-single-render-v6.js')

          for path in (controller, css, bootstrap):
              if not path.exists():
                  errors.append(f'Missing Chat V7 file: {path}')

          if errors:
              print('\n'.join(errors))
              sys.exit(1)

          controller_text = controller.read_text(encoding='utf-8')
          css_text = css.read_text(encoding='utf-8')
          bootstrap_text = bootstrap.read_text(encoding='utf-8')

          budgets = {
              'Chat V7 JS': (controller.stat().st_size, 56_000),
              'Chat V7 CSS': (css.stat().st_size, 20_000),
              'Chat bootstrap': (bootstrap.stat().st_size, 5_000),
          }

          for name, (size, limit) in budgets.items():
              print(f'{name}: {size} / {limit} bytes')
              if size > limit:
                  errors.append(f'{name} exceeds source budget: {size} > {limit}')

          required_js = (
              "version: '7.0'",
              "window.__PUMKM_CHAT_RENDER_OWNER = 'v7'",
              "openList: loadConversationList",
              'openConversation,',
              'openWithUser,',
              '/api/social/conversations',
              '/rich-meta',
              '/rich-message',
              '/mark-read',
              '/api/chat/media/upload',
              '/api/chat/media/cleanup',
              'new MutationObserver',
              "legacyObserver.observe(document.body, { childList: true, subtree: true })",
          )

          for contract in required_js:
              if contract not in controller_text:
                  errors.append(f'Missing Chat V7 controller contract: {contract}')

          if re.search(r'observe\s*\([^)]*\{[^}]*attributes\s*:\s*true', controller_text, re.S):
              errors.append('Chat V7 MutationObserver watches attributes; this can create self-loops')

          if 'setInterval(syncThread' in controller_text:
              errors.append('Chat V7 must use non-overlapping recursive timeout for thread synchronization')

          required_bootstrap = (
              "css/chat-experience-v7.css?v=7.0",
              "js/chat-experience-v7.js?v=7.0",
              '[data-action="messages"]',
              '[data-social-action="message-user"]',
              '[data-social-action="open-conversation"]',
              'event.stopImmediatePropagation()',
          )

          for contract in required_bootstrap:
              if contract not in bootstrap_text:
                  errors.append(f'Missing Chat V7 bootstrap contract: {contract}')

          tiny_fonts = [
              float(value)
              for value in re.findall(r'font-size\s*:\s*([0-9.]+)px', css_text)
              if float(value) < 10
          ]
          if tiny_fonts:
              errors.append(f'Chat V7 contains font sizes below 10px: {tiny_fonts}')

          if 'linear-gradient(' in css_text or 'radial-gradient(' in css_text:
              errors.append('Chat V7 contains decorative gradient')

          if 'backdrop-filter:' in css_text:
              errors.append('Chat V7 contains backdrop-filter')

          if 'prefers-reduced-motion:reduce' not in css_text.replace(' ', ''):
              errors.append('Chat V7 is missing reduced-motion handling')

          required_css = (
              'min-height:48px',
              'font-size:16px',
              '.chat-v7-list-page',
              '.chat-v7-thread-page',
              '.chat-v7-composer',
              '.chat-v7-message',
              '.chat-v7-voice',
              '.chat-v7-media-viewer',
          )

          compact_css = css_text.replace(' ', '')
          for contract in required_css:
              if contract.replace(' ', '') not in compact_css:
                  errors.append(f'Missing Chat V7 CSS contract: {contract}')

          retired_js = (
              'js/chat-stability-v4.js',
              'js/chat-experience.js',
              'js/chat-media-experience.js',
              'js/chat-mark-read.js',
              'js/chat-whatsapp-v5.js',
          )

          for filename in retired_js:
              path = Path(filename)
              size = path.stat().st_size
              print(f'Retired JS {filename}: {size} bytes')
              if size > 600:
                  errors.append(f'Retired chat controller regrew: {filename} = {size} bytes')

          retired_css = (
              'css/chat-single-render-v6.css',
              'css/chat-stability-v4.css',
              'css/chat-experience.css',
              'css/chat-layout-v2.css',
              'css/chat-whatsapp-v3.css',
              'css/chat-whatsapp-v5.css',
              'css/chat-bubble-final.css',
          )

          total_retired_css = 0
          for filename in retired_css:
              path = Path(filename)
              size = path.stat().st_size
              total_retired_css += size
              print(f'Retired CSS {filename}: {size} bytes')
              if size > 256:
                  errors.append(f'Retired chat CSS regrew: {filename} = {size} bytes')

          print(f'Total retired chat CSS compatibility payload: {total_retired_css} bytes')
          if total_retired_css > 1_500:
              errors.append(f'Retired chat CSS compatibility payload too large: {total_retired_css}')

          if errors:
              print('UI P4 Chat V7 validation failed:')
              for error in errors:
                  print(f'- {error}')
              sys.exit(1)

          print('UI P4 Chat V7 validation passed.')
