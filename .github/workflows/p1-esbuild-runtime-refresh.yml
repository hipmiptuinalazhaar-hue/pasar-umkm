name: P1 Esbuild Runtime Refresh

on:
  push:
    branches:
      - p1/esbuild-0-28-2-modernization

permissions:
  contents: write

concurrency:
  group: p1-esbuild-runtime-refresh
  cancel-in-progress: false

jobs:
  finalize-esbuild-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install exact locked toolchain
        run: npm ci --no-audit --no-fund

      - name: Align exact-version policy
        run: |
          python - <<'PY'
          from pathlib import Path
          targets = [
              Path('.github/workflows/supply-chain-validate.yml'),
              Path('.github/workflows/p4-final-audit.yml'),
          ]
          total = 0
          for path in targets:
              text = path.read_text(encoding='utf-8')
              count = text.count("0.25.10")
              if count == 0:
                  raise SystemExit(f'Expected old esbuild contract missing in {path}')
              path.write_text(text.replace("0.25.10", "0.28.2"), encoding='utf-8')
              total += count
          if total < 2:
              raise SystemExit('Insufficient exact-version replacements')
          print(f'Updated {total} exact esbuild contract references.')
          PY

      - name: Verify deterministic runtime and Worker bundle
        run: |
          set -euo pipefail
          ./node_modules/.bin/esbuild --version | grep -qx '0.28.2'
          npm run build:runtime
          node --check js/app.runtime.js
          ./node_modules/.bin/esbuild src/worker-entry.js --bundle --format=esm --platform=browser --target=es2022 --outfile=/tmp/worker-entry.js
          test -s /tmp/worker-entry.js
          git diff --check

      - name: Remove temporary build-room and commit final P1 state
        run: |
          set -euo pipefail
          git rm .github/workflows/p1-esbuild-runtime-refresh.yml
          git add package.json package-lock.json .github/workflows/supply-chain-validate.yml .github/workflows/p4-final-audit.yml js/app.runtime.js css/style.runtime.css index.html .assetsignore
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'P1: finalize esbuild 0.28.2 deterministic toolchain [skip ci]'
          git push origin "HEAD:${GITHUB_REF_NAME}"
