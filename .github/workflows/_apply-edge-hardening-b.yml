name: Apply Edge Hardening B Patch

on:
  push:
    branches:
      - hardening/error-edge-cases-b
    paths:
      - '.github/workflows/_apply-edge-hardening-b.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: hardening/error-edge-cases-b
          fetch-depth: 0

      - name: Apply exact scoped patch
        run: |
          python scripts/_apply_edge_hardening_b2.py
          rm scripts/_apply_edge_hardening_b.py scripts/_apply_edge_hardening_b2.py

      - name: Validate patch syntax and budgets
        run: |
          node --check js/commerce-experience-v2.js
          node --check src/functionality-api.js
          test "$(wc -c < js/commerce-experience-v2.js)" -le 80000

      - name: Commit scoped source patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/commerce-experience-v2.js src/functionality-api.js js/profile-saved.js index.html scripts/_apply_edge_hardening_b.py scripts/_apply_edge_hardening_b2.py
          git commit -m 'Harden commerce error and edge cases'
          git push origin HEAD:hardening/error-edge-cases-b
