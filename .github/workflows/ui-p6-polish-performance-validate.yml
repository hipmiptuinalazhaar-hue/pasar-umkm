name: UI P6 Polish Performance Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'index.html'
      - 'js/performance-v10-a.js'
      - 'js/account-resilience.js'
      - 'js/profile-saved.js'
      - 'js/profile-edit.js'
      - 'css/profile-edit.css'
      - 'css/rating-form-v3.css'
      - 'scripts/validate-edge-hardening-b.mjs'
      - 'scripts/validate-public-experience-v9.mjs'
      - 'scripts/validate-p8-real-commerce.mjs'
      - '.github/workflows/p2-validate.yml'
      - '.github/workflows/ui-p2-commerce-validate.yml'
      - '.github/workflows/ui-p3-social-validate.yml'
      - '.github/workflows/ui-p5-tablet-desktop-validate.yml'
      - '.github/workflows/ui-p6-polish-performance-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-final-delivery:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Enforce final-delivery maintenance scope
        if: github.head_ref == 'ui-p6-polish-performance'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          allowed='^(index\.html|js/performance-v10-a\.js|js/account-resilience\.js|js/profile-saved\.js|js/commerce-experience-v2\.js|js/profile-edit\.js|src/functionality-api\.js|scripts/validate-edge-hardening-b\.mjs|scripts/validate-public-experience-v9\.mjs|scripts/validate-p8-real-commerce\.mjs|docs/ERROR_EDGE_HARDENING_B\.md|css/profile-edit\.css|css/rating-form-v3\.css|\.github/workflows/edge-hardening-b-validate\.yml|\.github/workflows/p2-validate\.yml|\.github/workflows/ui-p2-commerce-validate\.yml|\.github/workflows/ui-p3-social-validate\.yml|\.github/workflows/ui-p5-tablet-desktop-validate\.yml|\.github/workflows/ui-p6-polish-performance-validate\.yml)$'
          changed="$(git diff --name-only origin/main...HEAD)"
          printf '%s\n' "$changed"
          bad="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          if [ -n "$bad" ]; then
            echo 'Final-delivery maintenance touched files outside guarded scope:'
            printf '%s\n' "$bad"
            exit 1
          fi

      - name: Validate JavaScript syntax
        run: |
          node --check js/performance-v10-a.js
          node --check js/account-resilience.js
          node --check js/profile-saved.js
          node --check js/profile-edit.js

      - name: Validate performance delivery contracts
        shell: python
        run: |
          from pathlib import Path
          import re
          import sys

          index_path = Path('index.html')
          v10_path = Path('js/performance-v10-a.js')
          loader_path = Path('js/account-resilience.js')
          carrier_path = Path('js/profile-saved.js')
          profile_path = Path('js/profile-edit.js')
          profile_css_path = Path('css/profile-edit.css')
          rating_css_path = Path('css/rating-form-v3.css')
          index = index_path.read_text(encoding='utf-8')
          v10 = v10_path.read_text(encoding='utf-8')
          loader = loader_path.read_text(encoding='utf-8')
          carrier = carrier_path.read_text(encoding='utf-8')
          profile = profile_path.read_text(encoding='utf-8')
          profile_css = profile_css_path.read_text(encoding='utf-8')
          rating_css = rating_css_path.read_text(encoding='utf-8')
          errors = []

          budgets = {
              'critical HTML': (index_path.stat().st_size, 16_500),
              'V10 adaptive bootstrap': (v10_path.stat().st_size, 12_000),
              'P6 loader': (loader_path.stat().st_size, 18_000),
              'Commerce carrier': (carrier_path.stat().st_size, 11_000),
              'Profile editor': (profile_path.stat().st_size, 26_000),
              'Rating form CSS': (rating_css_path.stat().st_size, 4_000),
          }
          for name, (size, limit) in budgets.items():
              print(f'{name}: {size} / {limit} bytes')
              if size > limit:
                  errors.append(f'{name} exceeds budget: {size} > {limit}')

          for asset in (
              '@phosphor-icons/web@2.1.2/src/regular/style.css',
              '@phosphor-icons/web@2.1.2/src/fill/style.css',
          ):
              if asset not in index:
                  errors.append(f'Missing selective Phosphor asset: {asset}')

          unsupported = ('ph-thin','ph-light','ph-bold','ph-duotone')
          active_icon_sources = [index]
          active_icon_sources.extend(path.read_text(encoding='utf-8', errors='ignore') for path in Path('js').glob('*.js'))
          for weight in unsupported:
              if any(weight in text for text in active_icon_sources):
                  errors.append(f'Unsupported Phosphor weight is still rendered by active code: {weight}')

          forbidden_index = (
              '<script src="https://unpkg.com/@phosphor-icons/web"',
              'chat-stability-v4.css','chat-single-render-v6.css','chat-stability-v4.js',
              'chat-whatsapp-v5.css','chat-whatsapp-v5.js',
              'commerce-experience-v2.css','commerce-experience-v2.js',
              'social-experience-v3.css','social-engagement-v3.css','social-media-v3.css','social-experience-v3.js',
              'chat-experience-v7.css','chat-experience-v7.js','rating-form-v3.css',
          )
          for marker in forbidden_index:
              if marker in index:
                  errors.append(f'Non-critical or retired asset leaked into initial HTML: {marker}')

          if 'display=optional' not in index:
              errors.append('Google font must use display=optional to avoid late layout swaps')
          if 'rel="preload" href="assets/logo.webp?v=2.0"' not in index:
              errors.append('Brand image preload contract missing')

          v10_index_match = re.search(r'js/performance-v10-a\.js\?v=([0-9a-f]{12})', index)
          account_loader_match = re.search(r"account:\s*'js/account-resilience\.js\?v=([0-9a-f]{12})(?:&[^']*)?'", v10)
          carrier_match = re.search(r"saved:\s*'js/profile-saved\.js\?v=([0-9a-f]{12})'", v10)
          commerce_match = re.search(r"commerce:\s*'js/p8-commerce-integration\.js\?v=([0-9a-f]{12})'", v10)
          if not v10_index_match:
              errors.append('V10 deterministic bootstrap fingerprint missing from index')
          if not account_loader_match:
              errors.append('Current account loader deterministic fingerprint missing from V10 graph')
          if not carrier_match:
              errors.append('P6 Commerce carrier deterministic fingerprint missing from V10 graph')
          if not commerce_match:
              errors.append('P8 deterministic router fingerprint missing from V10 graph')

          first_party_scripts = re.findall(r'<script[^>]+src="js/[^\"]+"', index)
          direct_first_party_styles = re.findall(r'<link\s+rel="stylesheet"[^>]+href="css/[^\"]+"', index)
          print(f'Initial first-party script requests: {len(first_party_scripts)} / 2')
          print(f'Direct first-party stylesheet requests: {len(direct_first_party_styles)} / 5')
          if len(first_party_scripts) != 2:
              errors.append(f'V10 critical JS owner count drifted: {len(first_party_scripts)} != 2')
          if len(direct_first_party_styles) != 5:
              errors.append(f'Direct CSS owner count drifted: {len(direct_first_party_styles)} != 5')
          if not re.search(r'<link\s+rel="preload"\s+href="css/public-experience-v9\.css\?v=[0-9a-f]{12}"\s+as="style">', index):
              errors.append('V9 early stylesheet discovery preload is missing or unfingerprinted')

          for contract in (
              "version === '10.1'", 'warmPublicBootstrap()','PUBLIC_CACHE_TTL_MS','hardwareConcurrency',
              'deviceMemory','saveData','installIntentGate','event.stopImmediatePropagation()','target.click()',
          ):
              if contract not in v10:
                  errors.append(f'Missing V10 delivery contract: {contract}')

          for contract in (
              'ensureCoreEnhancements','ensureProfileEnhancements','ensureMediaEnhancements',
              'ensureBusinessEnhancements','schedulePostRenderWarmup','requestIdleCallback',
              "loadSocialPresentation('profile')",'css/profile-edit.css?v=4.0','js/profile-edit.js?v=4.0',
              'css/rating-form-v3.css?v=3.0',"version: '1.1'",
          ):
              if contract not in loader:
                  errors.append(f'Missing P6 loader contract: {contract}')

          for marker in (
              'loadDeferredEnhancements','chat-experience.css','chat-layout-v2.css','chat-whatsapp-v3.css',
              'chat-bubble-final.css','chat-experience.js','chat-media-experience.js','chat-mark-read.js','store-management-core.js',
          ):
              if marker in loader:
                  errors.append(f'Retired/eager legacy asset remains in P6 loader: {marker}')

          for contract in ('collectOptionalContacts','profile-edit-error','validateWhatsapp','validateSocial','Profil tersimpan.'):
              if contract not in profile:
                  errors.append(f'Missing profile save resilience contract: {contract}')

          if 'linear-gradient' in profile_css or 'linear-gradient' in rating_css:
              errors.append('Profile/rating maintenance CSS must not add decorative gradients')

          font_sizes = [float(value) for value in re.findall(r'font-size:\s*([0-9.]+)px', profile_css + '\n' + rating_css)]
          if font_sizes and min(font_sizes) < 10:
              errors.append(f'Profile/rating CSS contains font below 10px: {min(font_sizes)}px')

          for contract in (
              '#orderRatingForm .product-card[data-rating-product-id]',
              '#orderRatingForm .product-card[data-rating-product-id] > .product-info',
              '#orderRatingForm select.auth-input',
              '#orderRatingForm textarea.auth-input',
              'min-height: 48px',
          ):
              if contract not in rating_css:
                  errors.append(f'Missing rating mobile isolation contract: {contract}')

          if 'chat-whatsapp-v5' in carrier:
              errors.append('Commerce carrier still requests retired WhatsApp V5 chat assets')
          for contract in (
              'window.__PASAR_COMMERCE_V2__ = true','css/commerce-experience-v2.css?v=2.0',
              'js/commerce-experience-v2.js?v=2.1',"document.addEventListener('pointerdown'", "document.addEventListener('click'",
          ):
              if contract not in carrier:
                  errors.append(f'Commerce lazy contract lost during P6: {contract}')

          if v10_index_match:
              print('V10 bootstrap fingerprint:', v10_index_match.group(1))
          if account_loader_match:
              print('Account loader fingerprint:', account_loader_match.group(1))
          if carrier_match:
              print('Commerce carrier fingerprint:', carrier_match.group(1))
          if commerce_match:
              print('P8 router fingerprint:', commerce_match.group(1))

          if errors:
              print('UI P6 Polish/Performance validation failed:')
              for error in errors:
                  print(f'- {error}')
              sys.exit(1)
          print('UI P6 Polish/Performance validation passed.')
