name: Runtime Assets Core

on:
  workflow_call:
    inputs:
      write_changes:
        description: Commit refreshed generated assets back to the current branch.
        required: false
        type: boolean
        default: false

jobs:
  runtime-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install locked Node toolchain
        run: npm ci --no-audit --no-fund

      - name: Install pinned image optimizer
        run: python -m pip install --disable-pip-version-check 'pillow==11.3.0'

      - name: Rebuild optimized runtime logo
        run: python scripts/optimize-logo.py

      - name: Rebuild deterministic runtime JS and CSS
        run: npm run build:runtime

      - name: Validate generated runtime artifacts
        run: |
          set -euo pipefail
          node --check js/app.runtime.js
          test -s css/style.runtime.css
          test -s assets/logo.webp
          grep -qE 'js/app\.runtime\.js\?v=[0-9a-f]{12}' index.html
          grep -qE 'css/style\.runtime\.css\?v=[0-9a-f]{12}' index.html
          ! grep -R --exclude-dir=.git -nF 'assets/logo.png' index.html js css
          grep -Fxq 'assets/logo.png' .assetsignore
          grep -Fxq 'js/app.js' .assetsignore
          grep -Fxq 'css/style.css' .assetsignore
          grep -Fxq 'scripts/' .assetsignore

      - name: Verify generated assets are committed
        if: ${{ !inputs.write_changes }}
        run: git diff --exit-code

      - name: Commit refreshed runtime assets
        if: ${{ inputs.write_changes }}
        env:
          TARGET_REF: ${{ github.ref_name }}
          TARGET_REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [ "$TARGET_REF_TYPE" != "branch" ]; then
            echo 'Runtime refresh hanya boleh menulis ke branch.' >&2
            exit 1
          fi
          if git diff --quiet; then
            echo 'Runtime assets sudah sinkron; tidak ada commit baru.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .assetsignore index.html assets/logo.webp js/app.runtime.js css/style.runtime.css
          git commit -m 'build: refresh deterministic runtime assets'
          git push origin HEAD:"$TARGET_REF"
