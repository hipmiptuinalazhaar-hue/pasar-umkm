name: Auth Runtime Readiness Probe

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/auth-runtime-readiness-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Add non-secret auth readiness to health endpoint
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/worker-entry.js';
          let source = fs.readFileSync(path, 'utf8');
          const before = `      staging_database_attested: stagingDatabaseAttested,\n      database: { connected: true },`;
          const after = `      staging_database_attested: stagingDatabaseAttested,\n      auth: {\n        verification_ready: Boolean(String(env?.RESEND_API_KEY || '').trim())\n          && Boolean(String(env?.AUTH_FROM_EMAIL || '').trim())\n          && String(env?.AUTH_OTP_PEPPER || '').length >= 32,\n        email_provider_configured: Boolean(String(env?.RESEND_API_KEY || '').trim()),\n        sender_configured: Boolean(String(env?.AUTH_FROM_EMAIL || '').trim()),\n        otp_pepper_configured: String(env?.AUTH_OTP_PEPPER || '').length >= 32\n      },\n      database: { connected: true },`;
          if (source.includes('email_provider_configured:')) {
            console.log('Auth readiness is already exposed.');
          } else {
            if (!source.includes(before)) throw new Error('Health response anchor changed unexpectedly.');
            source = source.replace(before, after);
            fs.writeFileSync(path, source);
          }
          NODE

      - name: Validate
        run: |
          node --check src/worker-entry.js
          node scripts/validate-auth-security-v2.mjs
          npm run lint

      - name: Remove one-shot workflow and commit
        run: |
          set -euo pipefail
          rm .github/workflows/auth-runtime-readiness-probe.yml
          git add src/worker-entry.js .github/workflows/auth-runtime-readiness-probe.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'chore(auth): expose production readiness status'
          git push origin HEAD:main
