name: P4.10 Avatar Commit Guard Bootstrap

on:
  push:
    branches:
      - p4-9-10-chat-profile-hardening

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Apply commit guard patch
        run: python scripts/p4_10_commit_guard_patch.py

      - name: Validate patch
        run: |
          set -euo pipefail
          node --check src/profile-media-api.js
          grep -Fq 'const committedDescriptor = uploadedDescriptor' src/profile-media-api.js
          grep -Fq 'uploadedDescriptor = null' src/profile-media-api.js
          grep -Fq 'destroyOwnedProfileMedia(env, { publicId: expectedPublicId })' src/profile-media-api.js

      - name: Commit patch
        env:
          TARGET_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/profile-media-api.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix(p4.10): protect committed avatar asset'
          git push origin HEAD:"$TARGET_REF"
