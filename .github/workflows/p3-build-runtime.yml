name: P3 Build Runtime Assets

on:
  push:
    branches:
      - p3-asset-bundle-optimization
    paths:
      - .github/workflows/p3-build-runtime.yml
      - js/app.js
      - css/style.css

permissions:
  contents: write

jobs:
  build-runtime:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: p3-asset-bundle-optimization
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build runtime JS without identifier mangling
        run: |
          npx --yes esbuild@0.25.10 js/app.js \
            --minify-whitespace \
            --minify-syntax \
            --target=es2022 \
            --outfile=js/app.runtime.js
          node --check js/app.runtime.js

      - name: Build minified runtime CSS
        run: |
          npx --yes esbuild@0.25.10 css/style.css \
            --minify \
            --outfile=css/style.runtime.css

      - name: Verify runtime reductions
        run: |
          python - <<'PY'
          from pathlib import Path

          pairs = [
              (Path('js/app.js'), Path('js/app.runtime.js'), 0.20),
              (Path('css/style.css'), Path('css/style.runtime.css'), 0.15),
          ]

          for source, runtime, minimum in pairs:
              source_size = source.stat().st_size
              runtime_size = runtime.stat().st_size
              reduction = (source_size - runtime_size) / source_size
              print(
                  f'{source}: {source_size} -> {runtime_size} bytes '
                  f'({reduction * 100:.1f}% smaller)'
              )
              if runtime_size >= source_size:
                  raise SystemExit(f'{runtime} tidak lebih kecil dari source')
              if reduction < minimum:
                  raise SystemExit(
                      f'{runtime} reduction {reduction:.1%} di bawah target {minimum:.0%}'
                  )
          PY

      - name: Switch index to runtime assets
        shell: python
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          from pathlib import Path
          import os
          import re

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          version = os.environ['BUILD_SHA'][:8]

          text, css_count = re.subn(
              r'css/style(?:\.runtime)?\.css\?v=[^"\']+',
              f'css/style.runtime.css?v={version}',
              text,
          )
          text, js_count = re.subn(
              r'js/app(?:\.runtime)?\.js\?v=[^"\']+',
              f'js/app.runtime.js?v={version}',
              text,
          )

          phosphor = '<script src="https://unpkg.com/@phosphor-icons/web"></script>'
          phosphor_defer = '<script src="https://unpkg.com/@phosphor-icons/web" defer></script>'
          if phosphor in text:
              text = text.replace(phosphor, phosphor_defer)

          if css_count != 1 or js_count != 1:
              raise SystemExit(
                  f'Index runtime switch tidak unik: css={css_count}, js={js_count}'
              )

          index.write_text(text, encoding='utf-8')

          ignore = Path('.assetsignore')
          lines = ignore.read_text(encoding='utf-8').splitlines()
          for source_path in ('js/app.js', 'css/style.css'):
              if source_path not in lines:
                  lines.append(source_path)
          ignore.write_text('\n'.join(lines).rstrip() + '\n', encoding='utf-8')

      - name: Verify index and deployment exclusions
        run: |
          grep -qF 'css/style.runtime.css?v=' index.html
          grep -qF 'js/app.runtime.js?v=' index.html
          ! grep -qE 'css/style\.css\?v=|js/app\.js\?v=' index.html
          grep -Fxq 'js/app.js' .assetsignore
          grep -Fxq 'css/style.css' .assetsignore
          grep -qF 'https://unpkg.com/@phosphor-icons/web" defer' index.html

      - name: Commit generated runtime assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/app.runtime.js css/style.runtime.css index.html .assetsignore
          git commit -m 'perf(p3): build compact runtime JS and CSS'
          git push origin HEAD:p3-asset-bundle-optimization
