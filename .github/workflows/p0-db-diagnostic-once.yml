name: P0 DB Diagnostic Once

on:
  push:
    branches:
      - p0-runtime-schema-hardening

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build safe diagnostic
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${DATABASE_URL:-}" ]; then
            printf '%s\n' '{"configured":false,"reason":"DATABASE_URL GitHub secret is not configured"}' > p0-db-diagnostic.json
            exit 0
          fi

          npm install --ignore-scripts --no-audit --no-fund

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { neon } from '@neondatabase/serverless';

          const sql = neon(process.env.DATABASE_URL);

          const rows = await sql`
            SELECT
              current_database() AS database_name,
              COUNT(*)::int AS public_table_count,
              array_agg(table_name ORDER BY table_name) AS tables
            FROM information_schema.tables
            WHERE table_schema = 'public'
          `;

          const stateRows = await sql`
            SELECT
              to_regclass('public.users') IS NOT NULL AS users,
              to_regclass('public.sessions') IS NOT NULL AS sessions,
              to_regclass('public.categories') IS NOT NULL AS categories,
              to_regclass('public.stores') IS NOT NULL AS stores,
              to_regclass('public.products') IS NOT NULL AS products,
              to_regclass('public.posts') IS NOT NULL AS posts,
              to_regclass('public.orders') IS NOT NULL AS orders,
              to_regclass('public.notifications') IS NOT NULL AS notifications
          `;

          const base = rows[0] || {};
          const state = stateRows[0] || {};
          const required = [
            'users', 'sessions', 'categories', 'stores',
            'products', 'posts', 'orders', 'notifications'
          ];

          const output = {
            configured: true,
            database_name: base.database_name || null,
            public_table_count: Number(base.public_table_count || 0),
            tables: Array.isArray(base.tables) ? base.tables : [],
            core_ready: required.every(name => Boolean(state[name])),
            missing_core: required.filter(name => !state[name])
          };

          fs.writeFileSync(
            'p0-db-diagnostic.json',
            JSON.stringify(output, null, 2) + '\n',
            'utf8'
          );
          NODE

      - name: Upload safe diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: p0-db-diagnostic
          path: p0-db-diagnostic.json
          if-no-files-found: error
          retention-days: 1
