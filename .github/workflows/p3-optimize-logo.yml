name: P3 Optimize Runtime Logo

on:
  push:
    branches:
      - p3-asset-bundle-optimization
    paths:
      - .github/workflows/p3-optimize-logo.yml
      - assets/logo.png

permissions:
  contents: write

jobs:
  optimize-logo:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: p3-asset-bundle-optimization
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Generate optimized WebP and switch runtime references
        shell: python
        run: |
          from pathlib import Path
          from PIL import Image

          source = Path('assets/logo.png')
          target = Path('assets/logo.webp')

          if not source.exists():
              raise SystemExit('assets/logo.png tidak ditemukan')

          original_bytes = source.stat().st_size

          with Image.open(source) as image:
              image.load()
              original_dimensions = image.size

              if max(image.size) > 768:
                  image.thumbnail((768, 768), Image.Resampling.LANCZOS)

              if image.mode not in ('RGB', 'RGBA'):
                  image = image.convert('RGBA')

              image.save(
                  target,
                  format='WEBP',
                  quality=88,
                  method=6,
              )

              optimized_dimensions = image.size

          optimized_bytes = target.stat().st_size

          if optimized_bytes >= original_bytes:
              raise SystemExit(
                  f'Optimasi ditolak: WebP {optimized_bytes} >= PNG {original_bytes}'
              )

          replacements = 0
          text_paths = [Path('index.html')]
          text_paths += sorted(Path('js').glob('*.js'))
          text_paths += sorted(Path('css').glob('*.css'))

          for path in text_paths:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              updated = text.replace('assets/logo.png', 'assets/logo.webp')
              if updated != text:
                  replacements += text.count('assets/logo.png')
                  path.write_text(updated, encoding='utf-8')

          if replacements < 1:
              raise SystemExit('Tidak ada referensi runtime assets/logo.png yang diganti')

          ignore = Path('.assetsignore')
          ignore_text = ignore.read_text(encoding='utf-8')
          if 'assets/logo.png' not in ignore_text.splitlines():
              ignore.write_text(
                  ignore_text.rstrip() + '\nassets/logo.png\n',
                  encoding='utf-8'
              )

          print(f'Original: {original_bytes} bytes, dimensions={original_dimensions}')
          print(f'Optimized: {optimized_bytes} bytes, dimensions={optimized_dimensions}')
          print(f'Runtime references replaced: {replacements}')
          print(f'Saved: {original_bytes - optimized_bytes} bytes')

      - name: Verify optimized asset
        run: |
          test -s assets/logo.webp
          ! grep -R --exclude='p3-optimize-logo.yml' --exclude-dir='.git' -nF 'assets/logo.png' index.html js css
          grep -Fxq 'assets/logo.png' .assetsignore
          python - <<'PY'
          from pathlib import Path
          png = Path('assets/logo.png').stat().st_size
          webp = Path('assets/logo.webp').stat().st_size
          reduction = 100 * (png - webp) / png
          print(f'logo.png:  {png} bytes')
          print(f'logo.webp: {webp} bytes')
          print(f'reduction: {reduction:.1f}%')
          if reduction < 40:
              raise SystemExit('Runtime logo reduction harus minimal 40%')
          PY

      - name: Commit optimized runtime asset
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/logo.webp .assetsignore index.html js css
          git commit -m 'perf(p3): optimize runtime logo asset'
          git push origin HEAD:p3-asset-bundle-optimization
