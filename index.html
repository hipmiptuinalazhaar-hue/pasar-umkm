<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#128c4e">
  <meta name="color-scheme" content="light">

  <meta
    name="description"
    content="Pasar UMKM adalah social marketplace untuk menemukan, mendukung, dan membeli produk UMKM lokal Lubuklinggau."
  >

  <meta
    name="keywords"
    content="Pasar UMKM, UMKM Lubuklinggau, marketplace lokal, produk lokal, HIPMI PT UIN Al Azhaar Lubuklinggau"
  >

  <meta
    name="author"
    content="Pasar UMKM"
  >

  <meta
    name="application-name"
    content="Pasar UMKM"
  >

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <title>
    Pasar UMKM — Lubuklinggau
  </title>


  <!-- =====================================================
       PERFORMANCE
       ===================================================== -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    rel="preconnect"
    href="https://unpkg.com"
  >


  <!-- =====================================================
       TYPOGRAPHY
       ===================================================== -->

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap"
    rel="stylesheet"
  >


  <!-- =====================================================
       ICON SYSTEM
       ===================================================== -->

  <script
    src="https://unpkg.com/@phosphor-icons/web"
    defer
  ></script>


  <!-- =====================================================
       DESIGN SYSTEM
       ===================================================== -->

  <link
    rel="stylesheet"
    href="css/tokens.css"
  >

  <link
    rel="stylesheet"
    href="css/style.css"
  >
</head>


<body>


  <!-- =====================================================
       SPLASH INTRO
       ===================================================== -->

  <section
    class="splash-intro"
    id="splashIntro"
    aria-label="Membuka Pasar UMKM"
  >

    <div
      class="splash-stage"
      aria-hidden="true"
    >

      <!-- CART ENTERS FROM LEFT -->

      <div
        class="splash-cart"
        id="splashCart"
      >
        <i class="ph ph-shopping-cart-simple"></i>
      </div>


      <!-- TAGLINE ENTERS FROM RIGHT -->

      <div
        class="splash-copy"
        id="splashCopy"
      >

        <span class="splash-copy-main">
          Belanja Lokal.
        </span>

        <span class="splash-copy-sub">
          Tumbuh Bersama.
        </span>

      </div>


      <!-- FINAL BRAND REVEAL -->

      <div
        class="splash-brand"
        id="splashBrand"
      >

        <img
          src="assets/logo.png"
          alt=""
          class="splash-logo"
          width="88"
          height="88"
        >


        <div class="splash-brand-text">

          <strong>
            Pasar UMKM
          </strong>

          <span>
            Lubuklinggau
          </span>

        </div>

      </div>

    </div>

  </section>



  <!-- =====================================================
       APP ROOT
       ===================================================== -->

  <div
    class="app"
    id="app"
  >


    <!-- ===================================================
         HEADER
         =================================================== -->

    <header
      class="app-header"
      id="header"
      role="banner"
    >

      <div class="header-main">


        <!-- MENU -->

        <button
          class="header-btn"
          id="menuButton"
          type="button"
          aria-label="Buka menu"
          aria-controls="sideMenu"
          aria-expanded="false"
          data-action="menu"
        >
          <i
            class="ph ph-list"
            aria-hidden="true"
          ></i>
        </button>



        <!-- BRAND -->

        <a
          href="#"
          class="brand"
          aria-label="Pasar UMKM, kembali ke beranda"
          data-nav="home"
        >

          <img
            src="assets/logo.png"
            alt=""
            class="brand-mark"
            width="34"
            height="34"
          >


          <div class="brand-wordmark">

            <span class="brand-name">
              Pasar UMKM
            </span>

            <span class="brand-location">
              Lubuklinggau
            </span>

          </div>

        </a>



        <!-- ACTIONS -->

        <div class="header-actions">


          <!-- SEARCH -->

          <button
            class="header-btn"
            id="searchButton"
            type="button"
            aria-label="Cari produk atau UMKM"
            data-action="search"
          >
            <i
              class="ph ph-magnifying-glass"
              aria-hidden="true"
            ></i>
          </button>



          <!-- NOTIFICATION -->

          <button
            class="header-btn"
            id="notificationButton"
            type="button"
            aria-label="Buka notifikasi"
            data-action="notifications"
          >

            <i
              class="ph ph-bell"
              aria-hidden="true"
            ></i>

            <span
              class="badge-dot"
              aria-hidden="true"
              hidden
            >
              0
            </span>

          </button>



          <!-- MESSAGE -->

          <button
            class="header-btn"
            id="messageButton"
            type="button"
            aria-label="Buka pesan"
            data-action="messages"
          >

            <i
              class="ph ph-chat-circle-text"
              aria-hidden="true"
            ></i>

            <span
              class="badge-dot"
              aria-hidden="true"
              hidden
            >
              0
            </span>

          </button>

        </div>

      </div>

    </header>



    <!-- ===================================================
         STORIES
         =================================================== -->

    <section
      class="stories-section"
      aria-label="Cerita UMKM"
    >

      <div
        class="stories-track"
        id="stories"
        role="list"
        aria-label="Cerita dan aktivitas penjual"
      >

        <!-- Dirender oleh app.js -->

      </div>

    </section>



    <!-- ===================================================
         MAIN FEED
         =================================================== -->

    <main
      class="feed"
      id="feed"
      role="main"
      aria-label="Feed Pasar UMKM"
    >

      <!-- Dirender oleh app.js -->

    </main>



    <!-- ===================================================
         BOTTOM NAVIGATION
         =================================================== -->

    <nav
      class="app-nav"
      id="appNavigation"
      aria-label="Navigasi utama"
    >


      <!-- HOME -->

      <a
        href="#"
        class="nav-link active"
        data-nav="home"
        aria-current="page"
        aria-label="Beranda"
      >

        <div class="nav-icon-wrap">

          <i
            class="ph-fill ph-house"
            aria-hidden="true"
          ></i>

        </div>

        <span class="nav-label">
          Beranda
        </span>

      </a>



      <!-- CATEGORY -->

      <a
        href="#kategori"
        class="nav-link"
        data-nav="categories"
        aria-label="Kategori"
      >

        <div class="nav-icon-wrap">

          <i
            class="ph ph-squares-four"
            aria-hidden="true"
          ></i>

        </div>

        <span class="nav-label">
          Kategori
        </span>

      </a>



      <!-- SELL -->

      <a
        href="#jual"
        class="nav-link nav-create"
        data-nav="sell"
        aria-label="Jual produk"
      >

        <div class="create-btn">

          <i
            class="ph ph-plus"
            aria-hidden="true"
          ></i>

        </div>

        <span class="sr-only">
          Jual
        </span>

      </a>



      <!-- CART -->

      <a
        href="#keranjang"
        class="nav-link"
        data-nav="cart"
        aria-label="Keranjang"
      >

        <div class="nav-icon-wrap">

          <i
            class="ph ph-shopping-cart"
            aria-hidden="true"
          ></i>

          <span
            class="nav-badge"
            aria-hidden="true"
            hidden
          >
            0
          </span>

        </div>

        <span class="nav-label">
          Keranjang
        </span>

      </a>



      <!-- ACCOUNT -->

      <a
        href="#akun"
        class="nav-link"
        data-nav="account"
        aria-label="Akun"
      >

        <div class="nav-icon-wrap">

          <i
            class="ph ph-user"
            aria-hidden="true"
          ></i>

        </div>

        <span class="nav-label">
          Akun
        </span>

      </a>

    </nav>



    <!-- ===================================================
         SIDE MENU
         =================================================== -->

    <aside
      class="side-menu"
      id="sideMenu"
      aria-hidden="true"
      hidden
    >

      <div class="side-menu-inner">


        <div class="side-menu-top">

          <span class="side-menu-title">
            Menu
          </span>


          <button
            class="header-btn"
            id="closeMenuButton"
            type="button"
            aria-label="Tutup menu"
            data-action="close-menu"
          >

            <i
              class="ph ph-x"
              aria-hidden="true"
            ></i>

          </button>

        </div>


        <div
          id="sideMenuContent"
          class="side-menu-content"
        >

          <!-- Dirender oleh app.js -->

        </div>

      </div>

    </aside>



    <!-- ===================================================
         SEARCH OVERLAY
         =================================================== -->

    <section
      class="search-overlay"
      id="searchOverlay"
      aria-hidden="true"
      hidden
      role="dialog"
      aria-modal="true"
      aria-label="Pencarian Pasar UMKM"
    >

      <div class="search-panel">


        <div class="search-panel-header">


          <button
            class="header-btn"
            id="closeSearchButton"
            type="button"
            aria-label="Tutup pencarian"
            data-action="close-search"
          >

            <i
              class="ph ph-arrow-left"
              aria-hidden="true"
            ></i>

          </button>



          <div class="search-input-wrap">

            <i
              class="ph ph-magnifying-glass"
              aria-hidden="true"
            ></i>


            <input
              type="search"
              id="searchInput"
              placeholder="Cari produk, UMKM, atau kategori"
              autocomplete="off"
              enterkeyhint="search"
              aria-label="Cari produk atau UMKM"
            >


            <button
              type="button"
              class="search-clear"
              id="searchClearButton"
              aria-label="Hapus pencarian"
              hidden
            >

              <i
                class="ph ph-x-circle"
                aria-hidden="true"
              ></i>

            </button>

          </div>

        </div>



        <div
          class="search-results"
          id="searchResults"
        >
          <!-- Dirender oleh app.js -->
        </div>

      </div>

    </section>



    <!-- ===================================================
         TOAST
         =================================================== -->

    <div
      class="toast"
      id="toast"
      role="status"
      aria-live="polite"
      aria-atomic="true"
    ></div>



    <!-- ===================================================
         SHEET OVERLAY
         =================================================== -->

    <div
      class="sheet-overlay"
      id="sheetOverlay"
      hidden
      aria-hidden="true"
    ></div>



    <!-- ===================================================
         BOTTOM SHEET
         =================================================== -->

    <section
      class="bottom-sheet"
      id="bottomSheet"
      hidden
      aria-hidden="true"
      aria-modal="true"
      role="dialog"
      aria-labelledby="sheetTitle"
    >

      <div
        class="sheet-handle"
        aria-hidden="true"
      ></div>


      <div
        class="sheet-content"
        id="sheetContent"
      >

        <!-- Dirender oleh app.js -->

      </div>

    </section>



    <!-- ===================================================
         GLOBAL LOADING
         =================================================== -->

    <div
      class="app-loading"
      id="appLoading"
      aria-hidden="true"
      hidden
    >

      <div
        class="loading-spinner"
        aria-hidden="true"
      ></div>

      <span>
        Memuat Pasar UMKM
      </span>

    </div>


  </div>



  <!-- =====================================================
       JAVASCRIPT
       ===================================================== -->

  <script
    src="js/app.js"
    defer
  ></script>


</body>
</html>
