<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#083725"
  >

  <meta
    name="description"
    content="Pasar UMKM Lubuklinggau, platform digital untuk menemukan produk, layanan, dan usaha lokal."
  >

  <title>Pasar UMKM Lubuklinggau</title>


  <!-- =====================================================
       FONT
       ===================================================== -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >


  <!-- =====================================================
       ICONS
       ===================================================== -->

  <script src="https://unpkg.com/@phosphor-icons/web"></script>


  <!-- =====================================================
       CSS
       ===================================================== -->

  <link
    rel="stylesheet"
    href="css/tokens.css"
  >

  <link
    rel="stylesheet"
    href="css/style.css"
  >

</head>


<body>


  <!-- =====================================================
       SPLASH
       ===================================================== -->

  <div
    id="splashIntro"
    class="splash-intro"
    aria-hidden="true"
  >

    <div class="splash-content">

      <img
        src="assets/logo.png"
        alt="Pasar UMKM"
        class="splash-logo"
      >

      <div
        class="splash-loader"
        aria-hidden="true"
      ></div>

    </div>

  </div>


  <!-- =====================================================
       APP
       ===================================================== -->

  <div class="app">


    <!-- ===================================================
         HEADER
         =================================================== -->

    <header
      id="header"
      class="app-header"
    >


      <!-- MENU -->

      <button
        id="menuButton"
        class="header-icon-button"
        type="button"
        data-action="menu"
        aria-label="Buka menu"
      >

        <i
          class="ph ph-list"
          aria-hidden="true"
        ></i>

      </button>


      <!-- BRAND -->

      <a
        href="#"
        class="header-brand"
        data-nav="home"
        aria-label="Pasar UMKM"
      >

        <img
          src="assets/logo.png"
          alt="Pasar UMKM"
          class="header-logo"
        >

      </a>


      <!-- SEARCH -->

      <button
        id="headerSearchButton"
        class="header-search"
        type="button"
        data-action="search"
        aria-label="Cari produk dan UMKM"
      >

        <i
          class="ph ph-magnifying-glass"
          aria-hidden="true"
        ></i>

        <span>
          Cari produk & UMKM...
        </span>

      </button>


      <!-- HEADER ACTIONS -->

      <div class="header-actions">


        <!-- NOTIFICATION -->

        <button
          id="notificationButton"
          class="header-icon-button"
          type="button"
          data-action="notifications"
          aria-label="Notifikasi"
        >

          <i
            class="ph ph-bell"
            aria-hidden="true"
          ></i>

          <span
            class="badge-dot"
            hidden
          ></span>

        </button>


        <!-- MESSAGE -->

        <button
          id="messageButton"
          class="header-icon-button"
          type="button"
          data-action="messages"
          aria-label="Pesan"
        >

          <i
            class="ph ph-chat-circle"
            aria-hidden="true"
          ></i>

          <span
            class="badge-dot"
            hidden
          ></span>

        </button>


      </div>

    </header>


    <!-- ===================================================
         MAIN CONTENT
         =================================================== -->

    <main class="app-main">


      <!-- =================================================
           STORIES
           Automatically hidden by JS if empty
           ================================================= -->

      <section
        id="storiesSection"
        class="stories-section"
        hidden
      >

        <div
          id="stories"
          class="stories"
        ></div>

      </section>


      <!-- =================================================
           DISCOVERY / HERO
           ================================================= -->

      <section
        id="homeDiscovery"
        class="home-discovery"
      >


        <!-- HERO -->

        <div class="discovery-card">

          <p class="discovery-eyebrow">
            PASAR UMKM LUBUKLINGGAU
          </p>


          <h1 class="discovery-title">
            Temukan usaha lokal di sekitarmu.
          </h1>


          <p class="discovery-text">
            Jelajahi produk dan UMKM lokal dalam satu tempat.
          </p>


          <div class="discovery-actions">


            <button
              type="button"
              class="btn-primary"
              data-menu-action="stores"
            >

              <i
                class="ph ph-storefront"
                aria-hidden="true"
              ></i>

              Jelajahi UMKM

            </button>


            <button
              type="button"
              class="btn-secondary"
              data-action="sell"
            >

              <i
                class="ph ph-plus-circle"
                aria-hidden="true"
              ></i>

              Mulai Jual

            </button>


          </div>

        </div>


        <!-- CATEGORY HEADER -->

        <div class="home-section-head">

          <h2>
            Kategori
          </h2>


          <button
            type="button"
            class="section-link"
            data-action="all-categories"
          >
            Lihat semua
          </button>

        </div>


        <!--
          Hanya 4 kategori utama dirender JS:
          Kuliner
          Fashion
          Jasa
          Finance
        -->

        <div
          id="quickCategories"
          class="quick-categories"
        ></div>


      </section>


      <!-- =================================================
           FEED
           ================================================= -->

      <section
        id="feed"
        class="feed"
        aria-live="polite"
      ></section>


    </main>


    <!-- ===================================================
         BOTTOM NAVIGATION
         =================================================== -->

    <nav
      id="appNavigation"
      class="app-navigation"
      aria-label="Navigasi utama"
    >


      <!-- HOME -->

      <button
        type="button"
        class="nav-item active"
        data-nav="home"
        aria-label="Beranda"
        aria-current="page"
      >

        <i
          class="ph-fill ph-house"
          aria-hidden="true"
        ></i>

        <span>
          Beranda
        </span>

      </button>


      <!-- CATEGORY -->

      <button
        type="button"
        class="nav-item"
        data-nav="categories"
        aria-label="Kategori"
      >

        <i
          class="ph ph-squares-four"
          aria-hidden="true"
        ></i>

        <span>
          Kategori
        </span>

      </button>


      <!-- SELL -->

      <button
        type="button"
        class="nav-item nav-item-create"
        data-nav="sell"
        aria-label="Mulai jual"
      >

        <span class="nav-create-icon">

          <i
            class="ph ph-plus"
            aria-hidden="true"
          ></i>

        </span>

        <span>
          Jual
        </span>

      </button>


      <!-- CART -->

      <button
        type="button"
        class="nav-item"
        data-nav="cart"
        aria-label="Keranjang"
      >

        <i
          class="ph ph-shopping-cart-simple"
          aria-hidden="true"
        ></i>

        <span>
          Keranjang
        </span>

        <span
          class="nav-badge"
          hidden
        ></span>

      </button>


      <!-- ACCOUNT -->

      <button
        type="button"
        class="nav-item"
        data-nav="account"
        aria-label="Akun"
      >

        <i
          class="ph ph-user"
          aria-hidden="true"
        ></i>

        <span>
          Akun
        </span>

      </button>


    </nav>


  </div>


  <!-- =====================================================
       SIDE MENU
       ===================================================== -->

  <div
    id="sideMenu"
    class="side-menu-overlay"
    hidden
    aria-hidden="true"
  >

    <aside
      class="side-menu-panel"
      aria-label="Menu Pasar UMKM"
    >


      <!-- SIDEBAR HEADER -->

      <div class="side-menu-head">


        <img
          src="assets/logo.png"
          alt="Pasar UMKM"
          class="side-menu-logo"
        >


        <button
          id="closeMenuButton"
          class="side-menu-close"
          type="button"
          data-action="close-menu"
          aria-label="Tutup menu"
        >

          <i
            class="ph ph-x"
            aria-hidden="true"
          ></i>

        </button>


      </div>


      <!-- =================================================
           GUEST ACCOUNT
           ================================================= -->

      <section
        id="sideAccountGuest"
        class="side-account"
      >

        <p class="side-account-guest-title">
          Selamat datang
        </p>


        <p class="side-account-guest-text">
          Masuk untuk belanja, menyimpan produk, dan mengelola UMKM.
        </p>


        <button
          type="button"
          class="btn-primary"
          data-action="login"
        >
          Masuk / Daftar
        </button>

      </section>


      <!-- =================================================
           LOGGED USER ACCOUNT
           ================================================= -->

      <section
        id="sideAccountUser"
        class="side-account"
        hidden
      >

        <div class="side-account-user-main">


          <div class="side-account-avatar">

            <i
              class="ph ph-user"
              aria-hidden="true"
            ></i>

          </div>


          <div class="side-account-user-info">

            <strong
              id="sideAccountUserName"
              class="side-account-user-name"
            >
              Pengguna
            </strong>


            <span
              id="sideAccountUserRole"
              class="side-account-user-role"
            >
              Pembeli
            </span>

          </div>


        </div>


        <button
          type="button"
          class="menu-sheet-btn"
          data-action="logout"
          style="margin-top:10px;"
        >

          <i
            class="ph ph-sign-out"
            aria-hidden="true"
          ></i>

          Keluar

        </button>

      </section>


      <!-- =================================================
           DYNAMIC MENU
           Filled by JS
           ================================================= -->

      <nav
        id="sideMenuContent"
        class="side-menu-content"
        aria-label="Menu samping"
      ></nav>


      <!-- =================================================
           SIDEBAR FOOTER
           ================================================= -->

      <footer class="side-menu-footer">

        <div class="side-menu-footer-brand">
          PASAR UMKM
        </div>


        <p class="side-menu-footer-label">
          Inisiatif HIPMI PT
        </p>


        <span class="side-menu-footer-name">
          UIN Al Azhaar Lubuklinggau
        </span>


        <p class="side-menu-footer-copyright">
          © 2026 Pasar UMKM
        </p>

      </footer>


    </aside>

  </div>


  <!-- =====================================================
       SEARCH OVERLAY
       ===================================================== -->

  <div
    id="searchOverlay"
    class="search-overlay"
    hidden
    aria-hidden="true"
  >

    <div class="search-shell">


      <!-- SEARCH HEADER -->

      <header class="search-head">


        <button
          id="closeSearchButton"
          type="button"
          class="search-close"
          data-action="close-search"
          aria-label="Tutup pencarian"
        >

          <i
            class="ph ph-arrow-left"
            aria-hidden="true"
          ></i>

        </button>


        <div class="search-box">


          <i
            class="ph ph-magnifying-glass"
            aria-hidden="true"
          ></i>


          <input
            id="searchInput"
            type="search"
            inputmode="search"
            autocomplete="off"
            placeholder="Cari produk, kategori, atau UMKM..."
            aria-label="Cari di Pasar UMKM"
          >


          <button
            id="searchClearButton"
            type="button"
            class="search-clear"
            aria-label="Hapus pencarian"
            hidden
          >

            <i
              class="ph-fill ph-x-circle"
              aria-hidden="true"
            ></i>

          </button>


        </div>


      </header>


      <!-- RESULTS -->

      <div
        id="searchResults"
        class="search-results"
        aria-live="polite"
      ></div>


    </div>

  </div>


  <!-- =====================================================
       SHEET OVERLAY
       ===================================================== -->

  <div
    id="sheetOverlay"
    class="sheet-overlay"
    hidden
    aria-hidden="true"
  ></div>


  <!-- =====================================================
       BOTTOM SHEET
       ===================================================== -->

  <section
    id="bottomSheet"
    class="bottom-sheet"
    hidden
    role="dialog"
    aria-modal="true"
    aria-labelledby="sheetTitle"
  >

    <div
      id="sheetContent"
      class="sheet-content"
    ></div>

  </section>


  <!-- =====================================================
       TOAST
       ===================================================== -->

  <div
    id="toast"
    class="toast"
    role="status"
    aria-live="polite"
  ></div>


  <!-- =====================================================
       LOADING
       ===================================================== -->

  <div
    id="appLoading"
    class="app-loading"
    hidden
    aria-hidden="true"
  >

    <div
      class="loading-spinner"
      aria-label="Memuat"
    ></div>

  </div>


  <!-- =====================================================
       JAVASCRIPT
       ===================================================== -->

  <script
    src="js/app.js"
    defer
  ></script>


</body>
</html>
