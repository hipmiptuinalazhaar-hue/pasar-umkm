<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#128c4e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <title>Pasar UMKM — Lubuklinggau</title>
  <meta name="description" content="Marketplace UMKM lokal Lubuklinggau dan Sumatera Selatan. Temukan produk terbaik dari penjual terpercaya.">
  
  <!-- Preconnect for speed -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  
  <!-- Icons (Phosphor, modern & clean) -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  
  <!-- Styles -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ==================== HEADER ==================== -->
  <header class="app-header" id="header">
    <div class="header-main">
      <button class="header-btn" aria-label="Menu">
        <i class="ph ph-list"></i>
      </button>
      
      <div class="brand">
        <img src="assets/logo.png" alt="" class="brand-mark">
        <div class="brand-wordmark">
          <span class="brand-name">Pasar UMKM</span>
          <span class="brand-location">Lubuklinggau</span>
        </div>
      </div>
      
      <div class="header-actions">
        <button class="header-btn" aria-label="Cari">
          <i class="ph ph-magnifying-glass"></i>
        </button>
        <button class="header-btn has-badge" aria-label="Notifikasi">
          <i class="ph ph-bell"></i>
          <span class="badge-dot">3</span>
        </button>
        <button class="header-btn has-badge" aria-label="Pesan">
          <i class="ph ph-chat-circle-text"></i>
          <span class="badge-dot">2</span>
        </button>
      </div>
    </div>
  </header>

  <!-- ==================== STORIES ==================== -->
  <section class="stories-section" aria-label="Cerita penjual">
    <div class="stories-track" id="stories">
      <!-- JS injects here -->
    </div>
  </section>

  <!-- ==================== MAIN FEED ==================== -->
  <main class="feed" id="feed" aria-label="Feed produk">
    <!-- JS injects here -->
  </main>

  <!-- ==================== BOTTOM NAV ==================== -->
  <nav class="app-nav" aria-label="Navigasi utama">
    <a href="#" class="nav-link active" aria-current="page">
      <div class="nav-icon-wrap">
        <i class="ph-fill ph-house"></i>
      </div>
      <span class="nav-label">Beranda</span>
    </a>
    
    <a href="#" class="nav-link">
      <div class="nav-icon-wrap">
        <i class="ph ph-squares-four"></i>
      </div>
      <span class="nav-label">Kategori</span>
    </a>
    
    <a href="#" class="nav-link nav-create">
      <div class="create-btn">
        <i class="ph ph-plus"></i>
      </div>
    </a>
    
    <a href="#" class="nav-link has-badge">
      <div class="nav-icon-wrap">
        <i class="ph ph-shopping-cart"></i>
        <span class="nav-badge">2</span>
      </div>
      <span class="nav-label">Keranjang</span>
    </a>
    
    <a href="#" class="nav-link">
      <div class="nav-icon-wrap">
        <i class="ph ph-user"></i>
      </div>
      <span class="nav-label">Akun</span>
    </a>
  </nav>

  <!-- ==================== OVERLAYS ==================== -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  
  <div class="sheet-overlay" id="sheetOverlay" hidden></div>
  
  <div class="bottom-sheet" id="bottomSheet" hidden>
    <div class="sheet-handle"></div>
    <div class="sheet-content" id="sheetContent"></div>
  </div>

  <!-- ==================== SCRIPTS ==================== -->
  <script src="js/app.js"></script>
</body>
</html>
